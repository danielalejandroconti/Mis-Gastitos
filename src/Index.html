<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis gastitos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --line:#E3E6DE; --line-soft:#EEF0E9; --ctl:#C9CEC4;
  --ink:#17211C; --ink2:#566159;
  --green:#0E6B4D; --green-bg:#DDEFE5;
  --amber:#A8480A; --amber-bg:#FCE9D2; --amber-tenue:#FFF8EE;
  --blue:#1F4F99; --blue-bg:#E1EAF7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.t{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-0.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{min-height:100vh;min-height:100dvh;display:flex}
.side{display:none}
.grid2{display:contents}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{flex:1;width:100%;max-width:720px;margin:0 auto;padding:20px 20px 120px;display:flex;flex-direction:column;gap:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(12px + env(safe-area-inset-bottom));z-index:20}
.bn{flex:1;min-height:48px;border:0;background:none;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 11px 'Figtree',sans-serif}
.bn.on{color:var(--green)}
.bn svg{display:block}
.bn .badge{position:absolute;top:-5px;right:-11px;min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bn .ico{position:relative;display:flex}
.fab{flex:1;display:flex;justify-content:center}
.fab button{width:52px;height:52px;border-radius:26px;border:0;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
@media(min-width:900px){
  .side{display:flex;flex:0 0 232px;flex-direction:column;gap:4px;background:var(--surface);border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;height:100vh}
  .bottom{display:none}
  .content{max-width:960px;padding:32px 40px 60px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
.brand{font-size:22px;padding:0 12px 20px}
.sl{height:44px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--ink);border:0;background:none;width:100%;text-align:left}
.sl.on{background:var(--green-bg);color:var(--green);font-weight:700}
.sl .b{margin-left:auto;background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700}
.sl-sep{margin:12px 12px 4px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.side-note{margin-top:auto;padding:12px;border-radius:14px;background:var(--bg);font-size:12px;line-height:1.45;color:var(--ink2)}

/* ---------- header / sync ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:28px}
.chip{font-size:12px;font-weight:700;border-radius:20px;padding:4px 11px;white-space:nowrap}
.chip.g{background:var(--green-bg);color:var(--green)}
.chip.a{background:var(--amber-bg);color:var(--amber)}
.chip.b{background:var(--blue-bg);color:var(--blue)}
.sync{font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px}
.sync.err{color:var(--amber)}
.sync button{border:0;background:var(--amber-bg);color:var(--amber);font-weight:700;font-size:12px;border-radius:10px;padding:5px 10px;min-height:32px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:15px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.big{font-size:34px;line-height:1.05}
.bar{height:8px;border-radius:4px;background:#E8EBE3;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:4px}
.catrow{display:flex;flex-direction:column;gap:5px}
.catrow .h{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.linkbtn{border:0;background:none;color:var(--green);font-weight:700;font-size:14px;padding:0;min-height:44px;text-align:left}
.btn{height:44px;border-radius:12px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font:600 14px 'Figtree',sans-serif;padding:0 16px}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.btn.w{width:100%}
.btn:disabled{opacity:.5}
.dashed{border-style:dashed}
.pat{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.pat:last-child{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:8px}

/* ---------- movimientos ---------- */
.seg{display:flex;background:#E8EBE3;border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border:0;border-radius:11px;background:none;font:600 14px 'Figtree',sans-serif;color:var(--ink2)}
.seg.s4 button{font-size:12.5px;padding:0 2px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{height:44px;border:1px solid var(--ctl);border-radius:12px;padding:0 14px;font:400 15px 'Figtree',sans-serif;background:#fff;width:100%}
.daylabel{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding:10px 4px 2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line-soft);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .c{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.row .a{font-size:15px;font-weight:700;white-space:nowrap}
.row .a.pos{color:var(--green)}
.row.warn{background:var(--amber-tenue)}
.ok{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--ctl);background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.ok.done{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.tag{font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px}
.tag.a{background:var(--amber-bg);color:var(--amber)}
.tag.sy{background:var(--blue-bg);color:var(--blue)}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);font-size:14px}

/* ---------- sheets (Nuevo / Editar) ---------- */
.sheetbg{position:fixed;inset:0;background:rgba(23,33,28,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media(min-width:900px){.sheetbg{align-items:center}.sheet{border-radius:24px}}
.sheet h2{margin:0;font-size:22px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between}
.x{width:44px;height:44px;border:0;background:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;margin-right:-10px}
.amt{display:flex;align-items:center;gap:10px}
.amt input{flex:1;min-width:0;border:0;background:none;font:700 44px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;color:var(--ink);padding:0;width:100%}
.amt input:focus{outline:none}
.amt input::placeholder{color:#B9BEB4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cb{flex:0 0 auto;min-height:44px;border-radius:22px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font:600 14px 'Figtree',sans-serif;padding:0 16px;white-space:nowrap}
.cb.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.lbl{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;display:block}
.fld{height:48px;width:100%;border:1px solid var(--ctl);border-radius:12px;background:#fff;padding:0 14px;font:400 16px 'Figtree',sans-serif;color:var(--ink)}
select.fld{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:600;z-index:60;max-width:90vw}
@media(min-width:900px){.toast{bottom:32px}}

.stk{position:sticky;left:0;background:#fff;text-align:left;padding:9px 12px;white-space:nowrap;z-index:1;min-width:112px;border-right:1px solid var(--line-soft)}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:30}
@media(min-width:900px){.bottombar{left:232px}}
body.imp .bottom{display:none}
details.listos>summary::-webkit-details-marker{display:none}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:100;text-align:center;padding:24px;color:var(--ink2);font-weight:600}
</style>
</head>
<body>

<div id="boot"><div class="t" style="font-size:26px;color:var(--ink)">Mis gastitos</div><div id="boot-msg">Cargando tus datos…</div></div>

<div class="app" id="app" hidden>
  <nav class="side" aria-label="Principal">
    <div class="t brand">Mis gastitos</div>
    <button class="sl" data-go="inicio"><span data-ic="home"></span>Inicio</button>
    <button class="sl" data-go="mov"><span data-ic="list"></span><span>Movimientos</span><span class="b hidden" id="side-badge">0</span></button>
    <button class="sl" data-go="cierre"><span data-ic="upload"></span>Cierre de mes</button>
    <button class="sl" data-go="cuentas"><span data-ic="wallet"></span>Cuentas</button>
    <div class="side-note"><b style="color:var(--ink)">Tus datos viven en tu Google Sheet.</b> <span id="side-sync">Sincronizado.</span><br><br>Reglas, topes por categoría y tarjetas siguen en la <a href="<?= ScriptApp.getService().getUrl() ?>?v=old" style="color:var(--green);font-weight:700">versión anterior</a> hasta que las pasemos.</div>
  </nav>

  <div class="main">
    <main class="content" id="content"></main>
  </div>

  <nav class="bottom" aria-label="Principal">
    <button class="bn" data-go="inicio"><span class="ico" data-ic="home"></span>Inicio</button>
    <button class="bn" data-go="mov"><span class="ico"><span data-ic="list"></span><span class="badge hidden" id="bn-badge">0</span></span>Movimientos</button>
    <div class="fab"><button id="fab" aria-label="Nuevo movimiento"><span data-ic="plus" data-size="24" data-sw="2.2"></span></button></div>
    <button class="bn" data-go="cierre"><span class="ico" data-ic="upload"></span>Cierre</button>
    <button class="bn" data-go="cuentas"><span class="ico" data-ic="wallet"></span>Cuentas</button>
  </nav>
</div>

<div id="overlay"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
/* =====================================================================
 * MIS GASTITOS v2 — Corte 1: Inicio · Movimientos · Nuevo movimiento
 * Backend: mismas llamadas de siempre (getBootstrap, getTransacciones, ...)
 * + addTransaccionManual (idempotente por id) y marcarValidadas.
 * ===================================================================== */
const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  wallet:'<path d="M3 7a2 2 0 012-2h13v4"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 14h2"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0112 6c6 0 10 6 10 6a17 17 0 01-3.2 3.9M6.6 6.6A17 17 0 002 12s4 7 10 7a9.7 9.7 0 004.4-1.1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>'
};
function ic(name, size, sw){
  return '<svg viewBox="0 0 24 24" width="'+(size||22)+'" height="'+(size||22)+'" fill="none" stroke="currentColor" stroke-width="'+(sw||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[name]+'</svg>';
}
document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = ic(el.dataset.ic, Number(el.dataset.size)||22, el.dataset.sw); });

/* ---------- estado ---------- */
var cuentas = [], reglas = [], transacciones = [], patrimonio = { grupos: [], totalEUR: 0 };
var vista = 'inicio';
var filtroMov = 'todos';      // 'todos' | 'pendientes'
var textoBusqueda = '';
var cola = [];                // altas locales que todavía no confirmó el servidor
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MESES_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var CATS_FALLBACK = ['Vivienda','Vida Diaria','Social/Ocio','Bienestar','Compras','Tarjeta','Ingresos','Ahorro/Inversión'];
var SUBCATS_BASE = {
  'Vivienda':['Alquiler','Hipoteca','Luz','Agua','Gas','Internet','Comunidad','Seguro hogar','Mantenimiento'],
  'Vida Diaria':['Supermercado','Transporte','Farmacia','Cuidado personal','Limpieza'],
  'Social/Ocio':['Restaurantes','Bares','Salidas','Viajes','Streaming','Regalos','Diversión'],
  'Bienestar':['Gimnasio','Deporte','Cuidado personal'],
  'Compras':['Ropa','Tecnología','Hogar','Regalos','Otros'],
  'Tarjeta':['Pago tarjeta','Liquidación tarjeta'],
  'Ingresos':['Sueldo','Freelance','Reintegro','Otros ingresos'],
  'Ahorro/Inversión':['Ahorro','Acciones','Crypto','Fondo emergencia','Transferencia propia']
};

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
}
function parseF(f){ var p=String(f).split('/'); return new Date(Number(p[2]),Number(p[1])-1,Number(p[0])); }
function isoHoy(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoAfmt(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmt(n, moneda, signo){
  var abs = Math.abs(n), neg = n < 0;
  var dec = (moneda==='ARS') ? 0 : (abs >= 1000 ? 0 : 2);
  var parts = abs.toFixed(dec).split('.');
  var s = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.') + (parts[1] ? ','+parts[1] : '');
  var pre = moneda==='ARS' ? '$ ' : moneda==='USD' ? 'US$ ' : '';
  var suf = moneda==='EUR' || !moneda ? ' €' : '';
  var sg = neg ? '−' : (signo ? '+' : '');
  return sg + pre + s + suf;
}
// Modo "mostrar mi app": oculta saldos y patrimonio (se acuerda en este dispositivo).
var oculto = lsGet('mg-oculto') === '1';
function sec(txt){ return oculto ? '•••••' : txt; }
function toggleOculto(){ oculto = !oculto; lsSet('mg-oculto', oculto ? '1' : '0'); render(); }
function btnOjo(){ return '<button aria-label="'+(oculto?'Mostrar saldos':'Ocultar saldos')+'" onclick="toggleOculto()" style="border:0;background:none;width:44px;height:44px;color:var(--ink2);display:flex;align-items:center;justify-content:center">'+ic(oculto?'eyeoff':'eye',22)+'</button>'; }
function esPendiente(t){ return t.validado === false; }
function faltaCat(t){ return !t.categoria; }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function toast(msg){
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.remove('hidden');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.add('hidden'); },2600);
}
function categoriasLista(){
  var s = {}; CATS_FALLBACK.forEach(function(c){ s[c]=1; });
  reglas.forEach(function(r){ if(r.categoria) s[r.categoria]=1; });
  transacciones.forEach(function(t){ if(t.categoria) s[t.categoria]=1; });
  return Object.keys(s).sort(function(a,b){ return a.localeCompare(b,'es'); });
}
function subcatsDe(cat){
  var s = {}; (SUBCATS_BASE[cat]||[]).forEach(function(x){ s[x]=1; });
  reglas.forEach(function(r){ if(r.categoria===cat && r.subcategoria) s[r.subcategoria]=1; });
  transacciones.forEach(function(t){ if(t.categoria===cat && t.subcategoria) s[t.subcategoria]=1; });
  return Object.keys(s).sort(function(a,b){ return a.localeCompare(b,'es'); });
}
function nombreCuenta(c){ return c['Nombre']; }
function monedaDeCuenta(nombre){ var c = cuentas.filter(function(x){return x['Nombre']===nombre;})[0]; return c ? c['Moneda'] : 'EUR'; }

/* ---------- carga ---------- */
function bootMsg(m){ document.getElementById('boot-msg').textContent = m; }
function bootError(err){
  var el = document.getElementById('boot');
  el.innerHTML = '<div class="t" style="font-size:22px;color:var(--ink)">No se pudo conectar con tu Sheet</div><div style="max-width:420px">'+esc(err && err.message ? err.message : String(err))+'</div><button class="btn p" onclick="location.reload()">Reintentar</button>';
}
var cargando = false;
function aplicarDatos(boot, txs){
  cuentas = boot.cuentas || []; reglas = boot.reglas || []; patrimonio = boot.patrimonio || patrimonio;
  if (boot.metaAhorro != null) metaAhorro = Number(boot.metaAhorro) || 0;
  var enCola = {}; cola.forEach(function(q){ enCola[q.tx.id]=true; });
  var servidor = txs.filter(function(t){ return !enCola[t.id]; });
  transacciones = cola.map(function(q){ return q.tx; }).concat(servidor);
  transacciones.sort(function(a,b){ return parseF(b.fecha)-parseF(a.fecha); });
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('app').hidden = false;
}
function cargar(silencioso){
  var hayCache = false;
  if (!silencioso) {
    var cache = null; try { cache = JSON.parse(lsGet('mg-cache') || 'null'); } catch(e){}
    if (cache && cache.boot && cache.tx) { aplicarDatos(cache.boot, cache.tx); hayCache = true; }
    else bootMsg('Cargando tus datos…');
  }
  cargando = true; setSync('ok'); if (hayCache) render();
  var res = {}, fallo = false;
  function error(e){
    if (fallo) return; fallo = true; cargando = false;
    if (!silencioso && !hayCache) bootError(e); else { setSync('err'); render(); }
  }
  function listo(){
    if (!res.boot || !res.tx) return;
    cargando = false;
    aplicarDatos(res.boot, res.tx);
    lsSet('mg-cache', JSON.stringify({ boot:{ cuentas:res.boot.cuentas, reglas:res.boot.reglas, patrimonio:res.boot.patrimonio, metaAhorro:res.boot.metaAhorro }, tx:res.tx }));
    setSync('ok'); render();
  }
  // las dos llamadas salen a la vez (antes iban una después de la otra)
  google.script.run.withFailureHandler(error).withSuccessHandler(function(d){
    if (!d) { error({message:'El servidor devolvió una respuesta vacía. Recargá la página.'}); return; }
    res.boot = d; listo();
  }).getBootstrapLiviano();
  google.script.run.withFailureHandler(error).withSuccessHandler(function(t){
    if (!t) { error({message:'No llegaron los movimientos (respuesta vacía). Recargá la página.'}); return; }
    res.tx = t; listo();
  }).getTransacciones();
}

/* ---------- sincronización de altas (optimista) ---------- */
function setSync(estado){
  var enviando = cola.filter(function(q){ return !q.error; }).length;
  var fallidas = cola.filter(function(q){ return q.error; }).length;
  var side = document.getElementById('side-sync');
  if (side) side.textContent = fallidas ? (fallidas+' sin guardar.') : enviando ? 'Sincronizando…' : (estado==='err' ? 'Sin conexión con el Sheet.' : 'Sincronizado.');
  var slot = document.getElementById('sync-slot');
  if (slot) slot.innerHTML = syncHtml(estado);
}
function syncHtml(estado){
  var enviando = cola.filter(function(q){ return !q.error; }).length;
  var fallidas = cola.filter(function(q){ return q.error; }).length;
  if (cargando && !fallidas) return '<div class="sync">Actualizando…</div>';
  if (fallidas) return '<div class="sync err">'+fallidas+' sin guardar <button onclick="reintentarCola()">Reintentar</button></div>';
  if (enviando) return '<div class="sync">Sincronizando…</div>';
  if (estado==='err') return '<div class="sync err">Sin conexión <button onclick="cargar(true)">Reintentar</button></div>';
  return '';
}
function enviar(q){
  q.error = false;
  google.script.run
    .withSuccessHandler(function(r){
      cola = cola.filter(function(x){ return x !== q; });
      delete q.tx._sync;
      if (r && r.ok === false) { toast(r.error || 'No se pudo guardar'); }
      setSync('ok'); render();
    })
    .withFailureHandler(function(e){
      q.error = true; q.tx._sync = 'error';
      setSync('ok'); render();
    })
    .addTransaccionManual(q.payload);
}
function reintentarCola(){ cola.filter(function(q){return q.error;}).forEach(function(q){ q.tx._sync='enviando'; enviar(q); }); setSync('ok'); render(); }

function guardarMovimiento(f){
  var id = uuid();
  var payload = { id:id, fecha:f.fecha, concepto:f.concepto, monto:f.monto, moneda:f.moneda, cuenta:f.cuenta, categoria:f.categoria, subcategoria:f.subcategoria, origen:'manual' };
  var tx = { id:id, fecha:isoAfmt(f.fecha), concepto:f.concepto, monto:f.monto, moneda:f.moneda, cuenta:f.cuenta, categoria:f.categoria, subcategoria:f.subcategoria, origen:'manual', notas:'', validado:false, grupo:'', miParte:null, conciliado:'', _sync:'enviando' };
  transacciones.unshift(tx);
  transacciones.sort(function(a,b){ return parseF(b.fecha)-parseF(a.fecha); });
  var q = { tx:tx, payload:payload, error:false };
  cola.push(q);
  lsSet('mg-cuenta', f.cuenta);
  var rec = []; try { rec = JSON.parse(lsGet('mg-cats')||'[]'); } catch(e){}
  if (f.categoria) { rec = [f.categoria].concat(rec.filter(function(c){return c!==f.categoria;})).slice(0,6); lsSet('mg-cats', JSON.stringify(rec)); }
  enviar(q); setSync('ok'); render();
}

/* =====================  INICIO (Mes | Año | Mes a mes)  ===================== */
var tabInicio = 'mes';
var mesVer = { a: new Date().getFullYear(), m: new Date().getMonth() };
var anioVer = new Date().getFullYear();
var selMes = null;
var metaAhorro = 3000;
var C_ING = '#0E6B4D', C_GAS = '#A8480A';

// Lo que realmente gastó/ganó Dani: si hay "Mi parte", el gasto cuenta solo su parte.
function efectivo(t){ return (t.miParte != null && t.monto < 0) ? -Math.abs(t.miParte) : t.monto; }

// Misma lógica que la versión anterior: solo EUR, sin Ahorro/Inversión, ingresos = categoría "Ingresos",
// gasto de cada categoría = neto del mes (los reembolsos de esa categoría restan).
function calcAnio(anio){
  var meses = []; for (var i=0;i<12;i++) meses.push({ ing:0, gas:0, neto:{}, porCat:{}, ingSub:{} });
  transacciones.forEach(function(t){
    if (t.moneda !== 'EUR' || t.categoria === 'Ahorro/Inversión') return;
    var f = parseF(t.fecha); if (isNaN(f.getTime()) || f.getFullYear() !== anio) return;
    var m = f.getMonth(), v = efectivo(t);
    if (t.categoria === 'Ingresos') { meses[m].ing += v; var sb = t.subcategoria || 'Otros'; meses[m].ingSub[sb] = (meses[m].ingSub[sb]||0) + v; }
    else { var c = t.categoria || 'Sin categoría'; meses[m].neto[c] = (meses[m].neto[c]||0) + v; }
  });
  meses.forEach(function(x){
    Object.keys(x.neto).forEach(function(c){ if (x.neto[c] < 0) { x.porCat[c] = -x.neto[c]; x.gas += -x.neto[c]; } });
  });
  return meses;
}
function arsDelMes(a, m){
  var tot = 0;
  transacciones.forEach(function(t){
    if (t.moneda !== 'ARS' || t.monto >= 0 || t.categoria === 'Ahorro/Inversión') return;
    var d = parseF(t.fecha); if (d.getFullYear()===a && d.getMonth()===m) tot += -efectivo(t);
  });
  return tot;
}
function hoyAM(){ var h = new Date(); return { a:h.getFullYear(), m:h.getMonth() }; }
function cambiarMes(d){
  var h = hoyAM(), n = mesVer.m + d, a = mesVer.a;
  if (n < 0) { n = 11; a--; } if (n > 11) { n = 0; a++; }
  if (a > h.a || (a === h.a && n > h.m)) return;
  mesVer = { a:a, m:n }; render();
}
function cambiarAnio(d){ var n = anioVer + d; if (n > hoyAM().a) return; anioVer = n; selMes = null; render(); }
function setTabInicio(t){ tabInicio = t; render(); }
function verMes(a, m){ mesVer = { a:a, m:m }; tabInicio = 'mes'; vista = 'inicio'; render(); window.scrollTo(0,0); }
function fmtK(n){ var a = Math.abs(n); return a >= 1000 ? (Math.round(a/100)/10).toString().replace('.',',')+'k' : String(Math.round(a)); }
function entero(n){ return Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }

function selector(etiqueta, fPrev, fNext, puedeNext){
  return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'

    + '<button class="x" style="margin:0'+(puedeNext?'':';opacity:.3')+'" aria-label="Siguiente" '+(puedeNext?'':'disabled ')+'onclick="'+fNext+'">'+ic('chevR',22)+'</button></div>';
}
function htmlInicio(){
  var h = '<div class="top"><div class="seg s4" style="flex:1;max-width:440px"><button class="'+(tabInicio==='mes'?'on':'')+'" onclick="setTabInicio(\'mes\')">Mes</button><button class="'+(tabInicio==='anio'?'on':'')+'" onclick="setTabInicio(\'anio\')">Año</button><button class="'+(tabInicio==='mam'?'on':'')+'" onclick="setTabInicio(\'mam\')">Mes a mes</button><button class="'+(tabInicio==='presu'?'on':'')+'" onclick="setTabInicio(\'presu\')">Presupuesto</button></div><div id="sync-slot"></div></div>';
  return h + (tabInicio === 'anio' ? htmlAnio() : tabInicio === 'mam' ? htmlMesAMes() : tabInicio === 'presu' ? htmlPresupuesto() : htmlMes());

// Ingresos y gastos se ven igual: mismo bloque, distinto desglose.
function cardFlujo(titulo, total, mapa, color, vacio){

    });
    h += '</div>';
  } else h += '<div class="muted" style="font-size:14px">'+vacio+'</div>';
  return h + '</div>';
}

function htmlMes(){

  });
  if (patrimonio.totalEUR) h += '<div class="card dashed" style="padding:10px 12px;flex-direction:row;justify-content:space-between;border-radius:12px"><span class="muted" style="font-size:13px">Total referencial</span><span class="num" style="font-weight:700">≈ '+sec(fmt(patrimonio.totalEUR,'EUR'))+'</span></div>';

/* ---------- gráficos de columnas (una serie por gráfico) ---------- */
function barPath(x, y, w, hh, r){
  if (hh <= 0) return '';
  r = Math.min(r, hh, w/2);
  return 'M'+x+' '+(y+hh)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+hh)+'Z';
}
function barPathAbajo(x, y, w, hh, r){   // barra que cuelga desde la línea base hacia abajo
  if (hh <= 0) return '';
  r = Math.min(r, hh, w/2);
  return 'M'+x+' '+y+'V'+(y+hh-r)+'Q'+x+' '+(y+hh)+' '+(x+r)+' '+(y+hh)+'H'+(x+w-r)+'Q'+(x+w)+' '+(y+hh)+' '+(x+w)+' '+(y+hh-r)+'V'+y+'Z';
}
function niceMax(v){ if (v <= 0) return 100; var e = Math.pow(10, Math.floor(Math.log10(v))); var f = v/e; var n = f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*e; }

// vals: 12 valores. opts: {color, signo} — con signo=true las barras negativas cuelgan y van en ámbar.
function svgColumnas(vals, hasta, opts, titulo){
  var W=340, Ht=150, L=34, B=20, T=8, R=4, pw = W-L-R, ph = Ht-B-T;
  var vis = vals.slice(0, hasta+1);
  var maxV = Math.max.apply(null, vis.concat([1])), minV = opts.signo ? Math.min.apply(null, vis.concat([0])) : 0;
  var top = niceMax(maxV), bot = minV < 0 ? -niceMax(-minV) : 0;
  var rg = top - bot, slot = pw/12, bw = 12;
  function Y(v){ return T + (top - v)/rg*ph; }
  var s = '<svg viewBox="0 0 '+W+' '+Ht+'" width="100%" role="img" aria-label="'+esc(titulo)+'" style="display:block">';
  [top, top/2, 0].concat(bot<0?[bot]:[]).forEach(function(v){
    var y = Y(v);
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="'+(v===0?'#C9CEC4':'#E3E6DE')+'" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9.5" fill="#566159">'+(v<0?'−':'')+fmtK(v)+'</text>';
  });
  vals.forEach(function(v, i){
    var cx = L + slot*i + slot/2, on = (selMes === i);
    if (on) s += '<rect x="'+(L+slot*i+1)+'" y="'+T+'" width="'+(slot-2)+'" height="'+ph+'" rx="6" fill="#F3F4EF"/>';
    if (i <= hasta && v) {
      if (v >= 0) s += '<path d="'+barPath(cx-bw/2, Y(v), bw, Y(0)-Y(v), 4)+'" fill="'+opts.color+'"/>';
      else s += '<path d="'+barPathAbajo(cx-bw/2, Y(0), bw, Y(v)-Y(0), 4)+'" fill="'+C_GAS+'"/>';
    }
    s += '<text x="'+cx+'" y="'+(Ht-5)+'" text-anchor="middle" font-size="10" fill="'+(on?'#17211C':'#566159')+'" font-weight="'+(on?'700':'500')+'">'+MESES[i].charAt(0).toUpperCase()+'</text>';
    s += '<rect data-m="'+i+'" x="'+(L+slot*i)+'" y="0" width="'+slot+'" height="'+Ht+'" fill="transparent" style="cursor:pointer"/>';
  });
  return s + '</svg>';
}
function svgAcumulado(meses, hasta){
  var W=340, Ht=110, L=34, R=34, T=10, B=18, pw=W-L-R, ph=Ht-T-B;
  var vals = [], acc = 0;
  for (var i=0;i<=hasta;i++){ acc += meses[i].ing - meses[i].gas; vals.push(acc); }
  if (!vals.length) return '';
  var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(1, Math.max.apply(null, vals)), rg = (hi-lo)||1;
  var step = pw/11;
  function X(i){ return L + step*i; } function Y(v){ return T + ph - (v-lo)/rg*ph; }
  var s = '<svg viewBox="0 0 '+W+' '+Ht+'" width="100%" role="img" aria-label="Ahorro acumulado del año" style="display:block">';
  s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#C9CEC4" stroke-width="1"/><text x="'+(L-5)+'" y="'+(Y(0)+3.5)+'" text-anchor="end" font-size="9.5" fill="#566159">0</text>';
  s += '<polyline fill="none" stroke="'+C_ING+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="'+vals.map(function(v,i){ return X(i)+','+Y(v); }).join(' ')+'"/>';
  var li = vals.length-1;
  s += '<circle cx="'+X(li)+'" cy="'+Y(vals[li])+'" r="4.5" fill="'+C_ING+'" stroke="#fff" stroke-width="2"/>';
  s += '<text x="'+(X(li)+8)+'" y="'+(Y(vals[li])+3.5)+'" font-size="11" font-weight="700" fill="#17211C">'+(vals[li]<0?'−':'')+fmtK(vals[li])+'</text>';
  for (var k=0;k<12;k++) s += '<text x="'+X(k)+'" y="'+(Ht-4)+'" text-anchor="middle" font-size="10" fill="#566159">'+MESES[k].charAt(0).toUpperCase()+'</text>';
  return s + '</svg>';
}

function htmlAnio(){
  var H = hoyAM(), A = anioVer, meses = calcAnio(A);
  var hasta = (A === H.a) ? H.m : 11;
  var ing = 0, gas = 0, cat = {};
  for (var i=0;i<=hasta;i++){ ing += meses[i].ing; gas += meses[i].gas; Object.keys(meses[i].porCat).forEach(function(c){ cat[c] = (cat[c]||0) + meses[i].porCat[c]; }); }
  var ahorro = ing - gas, tasa = ing > 0 ? Math.round(ahorro/ing*100) : null;
  var pct = metaAhorro > 0 ? Math.min(100, Math.max(0, ahorro/metaAhorro*100)) : 0;
  var restan = (A === H.a) ? 11 - H.m : 0, falta = metaAhorro - ahorro;
  var h = selector(String(A), 'cambiarAnio(-1)', 'cambiarAnio(1)', A < H.a);

  h += '<div class="card"><div class="eyebrow">Ahorro neto del año</div><div class="t big num" style="color:'+(ahorro>=0?'var(--green)':'var(--amber)')+'">'+fmt(ahorro,'EUR',true)+'</div>'
     + '<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:14px"><span><span class="muted">Ingresos</span> <b class="num">'+fmt(ing,'EUR')+'</b></span><span><span class="muted">Gastos</span> <b class="num">'+fmt(gas,'EUR')+'</b></span>'+(tasa!==null?'<span><span class="muted">Tasa de ahorro</span> <b class="num">'+tasa+'%</b></span>':'')+'</div>'
     + '<div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><i style="width:'+pct.toFixed(0)+'%"></i></div>'
     + '<div class="muted" style="font-size:13px;margin-top:6px">'+Math.round(pct)+'% de tu meta'
     + (falta > 0 && restan > 0 ? ' · te faltan '+fmt(falta,'EUR')+' (~'+fmt(falta/restan,'EUR')+'/mes en los '+restan+' meses que quedan)' : falta <= 0 ? ' · ¡meta cumplida!' : '')+'</div></div>'
     + '<div style="display:flex;align-items:center;gap:10px"><label class="lbl" for="meta" style="margin:0">Meta anual (€)</label><input id="meta" class="fld" style="width:130px;height:40px" inputmode="numeric" value="'+metaAhorro+'"></div></div>';

  h += '<div id="readout" class="card" style="display:block;padding:12px 16px;font-size:14px;min-height:50px;line-height:1.6"></div>';
  h += '<div id="charts"></div>';

  h += '<div class="card"><h2 class="t">Ahorro acumulado</h2><div class="muted" style="font-size:13px;margin-top:-6px">Ingresos menos gastos, sumados mes a mes (en k €)</div><div style="max-width:600px;width:100%">'+svgAcumulado(meses, hasta)+'</div></div>';

  var cats = Object.keys(cat).sort(function(a,b){ return cat[b]-cat[a]; });
  if (cats.length) {
    var mx = cat[cats[0]];
    h += '<div class="card"><h2 class="t">Adónde se fue la plata</h2><div style="display:flex;flex-direction:column;gap:12px">';
    cats.slice(0,8).forEach(function(k){
      h += '<div class="catrow"><div class="h"><span>'+esc(k)+'</span><span class="num">'+fmt(cat[k],'EUR')+' <span class="muted" style="font-weight:500">· '+(gas?Math.round(cat[k]/gas*100):0)+'%</span></span></div><div class="bar"><i style="width:'+Math.max(3,Math.round(cat[k]/mx*100))+'%;background:'+C_GAS+'"></i></div></div>';
    });
    h += '</div></div>';
  }
  setTimeout(function(){ pintarCharts(meses, hasta); var meta = document.getElementById('meta');
    if (meta) meta.addEventListener('input', function(){
      metaAhorro = Number(meta.value) || 0; clearTimeout(htmlAnio._t);
      htmlAnio._t = setTimeout(function(){ google.script.run.guardarMetaAhorro(metaAhorro); render(); }, 900);
    }); }, 0);
  return h;
}
function cardSerie(titulo, color, vals, hasta, opts){
  return '<div class="card" style="margin-bottom:14px"><h2 class="t">'+titulo+'</h2><div style="max-width:600px;width:100%">'+svgColumnas(vals, hasta, opts, titulo)+'</div></div>';
}
function pintarCharts(meses, hasta){
  var c = document.getElementById('charts'); if (!c) return;

/* =====================  PRESUPUESTO (simulación, no toca tus datos)  ===================== */
var sim = { cargado:false, cargando:false, guardado:{}, agregando:false, timer:null, det:null, detKey:'' };

function normConcepto(c){
  var s = String(c||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  s = s.replace(/[0-9]+/g,' ').replace(/[^a-z ]+/g,' ');
  var stop = {compra:1,tarj:1,tarjeta:1,pago:1,recibo:1,adeudo:1,transferencia:1,trf:1,de:1,del:1,la:1,el:1,en:1,con:1,movil:1,pos:1,cargo:1,domiciliacion:1,sepa:1,visa:1,eur:1};
  return s.split(/\s+/).filter(function(x){ return x.length>1 && !stop[x]; }).slice(0,3).join(' ');
}
function mediana(a){ var b=a.slice().sort(function(x,y){return x-y;}), n=b.length; return n%2 ? b[(n-1)/2] : (b[n/2-1]+b[n/2])/2; }

// Gastos que se repiten (EUR, últimos 6 meses): ≥3 meses distintos, vistos en el mes actual o el anterior, y no más de 2 veces por mes.
// "fijo" = el monto mensual casi no cambia (máx/mín ≤ 1,25); "varia" = se repite pero el monto cambia.
function detectarFijos(){
  var H = hoyAM(), cur = H.a*12 + H.m, key = transacciones.length + '|' + cur;
  if (sim.det && sim.detKey === key) return sim.det;
  var g = {};
  transacciones.forEach(function(t){
    if (t.moneda !== 'EUR' || t.monto >= 0 || t.categoria === 'Ahorro/Inversión' || t.categoria === 'Ingresos') return;
    var f = parseF(t.fecha); if (isNaN(f.getTime())) return;
    var idx = f.getFullYear()*12 + f.getMonth(); if (idx < cur-5 || idx > cur) return;
    var k = normConcepto(t.concepto); if (!k) return;
    var o = g[k] || (g[k] = { clave:k, nombre:t.concepto, meses:{}, n:0 });
    o.meses[idx] = (o.meses[idx]||0) - efectivo(t); o.n++;
  });
  var out = [];
  Object.keys(g).forEach(function(k){
    var o = g[k], idxs = Object.keys(o.meses).map(Number), nm = idxs.length;
    if (nm < 3 || Math.max.apply(null, idxs) < cur-1 || o.n/nm > 2) return;
    var comp = idxs.filter(function(i){ return i < cur; });
    var vals = (comp.length >= 3 ? comp : idxs).map(function(i){ return o.meses[i]; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if (mn <= 0) return;
    out.push({ clave:k, nombre:o.nombre, monto:Math.round(mediana(vals)*100)/100, meses:nm, clase: mx/mn <= 1.25 ? 'fijo' : 'varia' });
  });
  out.sort(function(a,b){ return b.monto - a.monto; });
  sim.det = out; sim.detKey = key;
  return out;
}
function simItems(){
  var out = [];
  detectarFijos().forEach(function(d){
    var g = sim.guardado[d.clave];
    out.push({ clave:d.clave, nombre:(g&&g.nombre)||d.nombre, monto:g?g.monto:d.monto, activo:g?g.activo:d.clase==='fijo', clase:d.clase, meses:d.meses, manual:false });
  });
  Object.keys(sim.guardado).forEach(function(k){ var g = sim.guardado[k]; if (g.manual) out.push({ clave:k, nombre:g.nombre, monto:g.monto, activo:g.activo, clase:'manual', manual:true }); });
  return out;
}
function promedio3(){
  var H = hoyAM(), cache = {}, ing = 0, gas = 0, n = 0;
  for (var k=1;k<=3;k++){
    var idx = H.a*12 + H.m - k, a = Math.floor(idx/12), m = idx % 12;
    var ms = cache[a] || (cache[a] = calcAnio(a));
    if (ms[m].ing || ms[m].gas){ ing += ms[m].ing; gas += ms[m].gas; n++; }
  }
  return n ? { ing:ing/n, gas:gas/n, n:n } : { ing:0, gas:0, n:0 };
}
function simNums(){
  var fijos = 0; simItems().forEach(function(x){ if (x.activo) fijos += x.monto; });
  var base = 0; detectarFijos().forEach(function(d){ if (d.clase === 'fijo') base += d.monto; });
  var p = promedio3();
  var ing = sim.guardado._ingreso ? sim.guardado._ingreso.monto : Math.round(p.ing);
  var vars = sim.guardado._variables ? sim.guardado._variables.monto : Math.max(0, Math.round(p.gas - base));
  return { fijos:fijos, ing:ing, vars:vars, ahorro:ing - fijos - vars, p:p };
}

/* ---------- importador de extractos ---------- */
function abrirImportar(nombre){
  var c = cuentas.filter(function(x){ return x['Nombre'] === nombre; })[0]; if (!c) return;
  imp = { cuenta:nombre, perfil:perfilDe(c), moneda:c['Moneda'] || 'EUR', estado:'elegir', filas:[], info:'', error:'', abiertas:{} };
  vista = 'importar'; render(); window.scrollTo(0,0);
}
function cancelarImportar(){ imp = null; vista = 'cierre'; render(); }
function leerExtracto(file){
  imp.estado = 'cargando'; imp.error = ''; render();
  var rd = new FileReader();
  rd.onload = function(){
    google.script.run
      .withSuccessHandler(function(res){
        if (!res || !res.ok) { imp.estado = 'elegir'; imp.error = (res && res.error) || 'No se pudo leer el archivo.'; render(); return; }
        imp.filas = res.filas.map(function(f){
          var r = { fecha:f.fecha, concepto:f.concepto, monto:f.monto, categoria:f.categoria||'', subcategoria:f.subcategoria||'', auto:!!f.autoDetectado,
                    candidatos:f.candidatos||[], fusionarCon:f.fusionarCon||'', recordarRegla:!f.autoDetectado, _orig:{ c:f.categoria||'', s:f.subcategoria||'', a:!!f.autoDetectado } };
          if (r.fusionarCon) aplicarFusion(r, r.fusionarCon);
          return r;
        });
        imp.info = file.name + ': ' + imp.filas.length + ' movimientos nuevos'
          + (res.duplicados ? ' · ' + res.duplicados + ' ya estaban cargados (se ignoraron)' : '')
          + (res.omitidosPorEstado ? ' · ' + res.omitidosPorEstado + ' pendientes en el banco (se ignoraron por ahora)' : '');
        imp.estado = 'revisar'; render(); window.scrollTo(0,0);
      })
      .withFailureHandler(function(e){ imp.estado = 'elegir'; imp.error = (e && e.message) || String(e); render(); })
      .previsualizarExtracto(imp.perfil, imp.cuenta, rd.result);
  };
  rd.readAsText(file);
}
function aplicarFusion(r, id){
  var c = r.candidatos.filter(function(x){ return x.id === id; })[0]; if (!c) return;
  r.fusionarCon = id;
  if (c.categoria) { r.categoria = c.categoria; r.subcategoria = c.subcategoria; r.auto = true; }
}
function quitarFusion(r){
  r.fusionarCon = ''; r.categoria = r._orig.c; r.subcategoria = r._orig.s; r.auto = r._orig.a;
}
function setFusion(i, id){ var r = imp.filas[i]; if (id) aplicarFusion(r, id); else quitarFusion(r); render(); }
function grupoFila(r){ return r.candidatos.length ? 'coinc' : (r.categoria ? 'listo' : 'revisar'); }

/* dividir un movimiento en varias partes (por ej. una transferencia que junta alquiler + súper) */
var div = null;
function abrirDividir(i){
  var r = imp.filas[i], mitad = Math.round(r.monto/2*100)/100;
  div = { i:i, partes:[ { monto:mitad, concepto:r.concepto, categoria:r.categoria, subcategoria:r.subcategoria }, { monto:Math.round((r.monto-mitad)*100)/100, concepto:r.concepto, categoria:'', subcategoria:'' } ] };
  pintarDividir();
}
function leerDividir(){
  document.querySelectorAll('[data-dp]').forEach(function(el){
    var p = div.partes[Number(el.dataset.dp)], k = el.dataset.k;
    p[k] = (k === 'monto') ? (Number(String(el.value).replace(',', '.')) || 0) : el.value;
  });
}
function pintarDividir(){
  var r = imp.filas[div.i];
  var suma = Math.round(div.partes.reduce(function(s,p){ return s + (Number(p.monto)||0); }, 0)*100)/100, objetivo = Math.round(r.monto*100)/100, ok = Math.abs(suma-objetivo) < 0.01;
  var h = '<div class="sheetbg" onclick="if(event.target===this)cerrarDividir()"><div class="sheet" role="dialog" aria-label="Dividir movimiento"><div class="hd"><h2 class="t">Dividir</h2><button class="x" aria-label="Cerrar" onclick="cerrarDividir()">'+ic('close',22)+'</button></div>'
    + '<div class="muted" style="font-size:14px">Total del banco: <b class="num">'+fmt(r.monto,imp.moneda,true)+'</b>. Las partes tienen que sumar exactamente eso.</div>';
  div.partes.forEach(function(p, k){
    h += '<div class="card" style="gap:8px"><div class="two"><input class="fld" data-dp="'+k+'" data-k="monto" inputmode="decimal" aria-label="Monto" value="'+String(p.monto).replace('.',',')+'"><input class="fld" data-dp="'+k+'" data-k="concepto" aria-label="Concepto" value="'+esc(p.concepto)+'"></div>'
      + '<div class="two"><select class="fld" data-dp="'+k+'" data-k="categoria" aria-label="Categoría">'+opcionesCat(p.categoria)+'</select><select class="fld" data-dp="'+k+'" data-k="subcategoria" aria-label="Subcategoría">'+opcionesSub(p.categoria,p.subcategoria)+'</select></div>'
      + (div.partes.length>2 ? '<button class="linkbtn" onclick="leerDividir();div.partes.splice('+k+',1);pintarDividir()">Quitar esta parte</button>' : '')+'</div>';
  });
  h += '<button class="btn" onclick="leerDividir();div.partes.push({monto:0,concepto:imp.filas[div.i].concepto,categoria:\'\',subcategoria:\'\'});pintarDividir()">+ Agregar parte</button>'
    + '<div id="div-suma" class="'+(ok?'chip g':'err')+'" style="align-self:flex-start">Suma '+fmt(suma,imp.moneda)+' de '+fmt(objetivo,imp.moneda)+(ok?' ✓':'')+'</div>'
    + '<button id="div-ok" class="btn p" style="height:52px" '+(ok?'':'disabled ')+'onclick="guardarDividir()">Dividir</button></div></div>';
  document.getElementById('overlay').innerHTML = h;
  document.querySelectorAll('[data-dp]').forEach(function(el){
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function(){
      leerDividir();
      if (el.dataset.k === 'categoria') { div.partes[Number(el.dataset.dp)].subcategoria = ''; pintarDividir(); }
      else if (el.dataset.k === 'monto') actualizarSumaDividir();
    });
  });
}
function actualizarSumaDividir(){
  var r = imp.filas[div.i];
  var suma = Math.round(div.partes.reduce(function(s,p){ return s + (Number(p.monto)||0); }, 0)*100)/100, objetivo = Math.round(r.monto*100)/100, ok = Math.abs(suma-objetivo) < 0.01;
  var c = document.getElementById('div-suma'), b = document.getElementById('div-ok');
  if (c) { c.className = ok ? 'chip g' : 'err'; c.textContent = 'Suma '+fmt(suma,imp.moneda)+' de '+fmt(objetivo,imp.moneda)+(ok?' ✓':''); }
  if (b) b.disabled = !ok;
}
function cerrarDividir(){ div = null; document.getElementById('overlay').innerHTML = ''; }
function guardarDividir(){
  leerDividir();
  var r = imp.filas[div.i];
  var suma = Math.round(div.partes.reduce(function(s,p){ return s + (Number(p.monto)||0); }, 0)*100)/100;
  if (Math.abs(suma - Math.round(r.monto*100)/100) >= 0.01) { pintarDividir(); toast('Las partes no suman el total'); return; }
  if (div.partes.some(function(p){ return !String(p.concepto).trim(); })) { toast('Poné un concepto en cada parte'); return; }
  var nuevas = div.partes.map(function(p){ return { fecha:r.fecha, concepto:p.concepto, monto:p.monto, categoria:p.categoria, subcategoria:p.subcategoria, auto:false, candidatos:[], fusionarCon:'', recordarRegla:false, _orig:{ c:p.categoria, s:p.subcategoria, a:false } }; });
  imp.filas.splice.apply(imp.filas, [div.i, 1].concat(nuevas));
  imp.abiertas = {}; cerrarDividir(); render();
}

function confirmarExtracto(){
  if (imp.estado === 'enviando') return;
  imp.estado = 'enviando'; render();
  var payload = imp.filas.map(function(r){ return { fecha:r.fecha, concepto:r.concepto, monto:Number(r.monto), categoria:r.categoria, subcategoria:r.subcategoria, recordarRegla:!!r.recordarRegla, fusionarCon:r.fusionarCon || '' }; });
  google.script.run
    .withSuccessHandler(function(res){
      var msg = (res.fusionados||0) + ' fusionados · ' + (res.agregados||0) + ' nuevos' + (res.omitidosPorDuplicado ? ' · ' + res.omitidosPorDuplicado + ' ya estaban' : '');
      imp = null; vista = 'cierre'; toast('Importado: ' + msg); cargar(true);
    })
    .withFailureHandler(function(e){ imp.estado = 'revisar'; imp.error = (e && e.message) || String(e); render(); window.scrollTo(0,0); })
    .confirmarExtracto(imp.perfil, imp.cuenta, imp.moneda, payload);
}

function coincide(t, q){
  if (!q) return true;
  q = q.toLowerCase().trim();
  if (String(t.concepto).toLowerCase().indexOf(q) !== -1) return true;
  var d = q.replace(/[^0-9]/g,''); if (!d) return false;
  var a = String(Math.round(Math.abs(t.monto))), b = Math.abs(t.monto).toFixed(2).replace('.','');
  return a.indexOf(d)!==-1 || b.indexOf(d)!==-1;
}
function etiquetaDia(f){
  var d = parseF(f), hoy = new Date(); hoy.setHours(0,0,0,0);
  var diff = Math.round((hoy - d)/86400000);
  if (diff===0) return 'Hoy'; if (diff===1) return 'Ayer';
  return d.getDate()+' '+MESES[d.getMonth()]+(d.getFullYear()!==hoy.getFullYear()?' '+d.getFullYear():'');
}
function renderLista(){
  var el = document.getElementById('lista'); if (!el) return;
  var xs = transacciones.filter(function(t){ return (filtroMov==='todos' || esPendiente(t)) && coincide(t, textoBusqueda); });
  var total = xs.length; xs = xs.slice(0, 150);
  if (!xs.length) { el.innerHTML = '<div class="list"><div class="empty">'+(filtroMov==='pendientes'?'No hay pendientes. ✓':'No hay movimientos que coincidan.')+'</div></div>'; return; }
  var h = '', dia = null, abierto = false;
  xs.forEach(function(t){
    var et = etiquetaDia(t.fecha);
    if (et !== dia) { if (abierto) h += '</div>'; h += '<div class="daylabel">'+esc(et)+'</div><div class="list">'; dia = et; abierto = true; }
    h += filaHtml(t);
  });
  if (abierto) h += '</div>';
  if (total > xs.length) h += '<div class="empty">Mostrando '+xs.length+' de '+total+'. Usá la búsqueda para acotar.</div>';
  el.innerHTML = h;
}
function filaHtml(t){
  var pend = esPendiente(t), falta = faltaCat(t);
  var sub = '<span>'+esc(t.cuenta)+'</span>';
  if (falta) sub += '<span class="tag a">Falta la categoría</span>';
  else sub += '<span>· '+esc(t.categoria)+(t.subcategoria?' › '+esc(t.subcategoria):'')+'</span>';
  if (t._sync === 'enviando') sub += '<span class="tag sy">Guardando…</span>';
  if (t._sync === 'error') sub += '<span class="tag a">Sin guardar</span>';
  var btn = '';
  if (pend && !t._sync) btn = '<span class="ok" role="button" tabindex="0" aria-label="Confirmar movimiento" '+(falta?'style="opacity:.35" ':'')+'onclick="event.stopPropagation();'+(falta?'abrirEditar(\''+t.id+'\')':'confirmarUno(\''+t.id+'\')')+'">'+ic('check',20,2.2)+'</span>';
  else if (!pend) btn = '<span class="ok done" aria-label="Confirmado">'+ic('check',20,2.2)+'</span>';
  else btn = '<span style="width:44px"></span>';
  return '<button class="row'+(falta&&pend?' warn':'')+'" onclick="abrirEditar(\''+t.id+'\')">'
    + '<div class="m"><div class="c">'+esc(t.concepto)+'</div><div class="s">'+sub+'</div></div>'
    + '<div class="a num'+(t.monto>0?' pos':'')+'">'+fmt(t.monto,t.moneda,true)+'</div>'+btn+'</button>';
}
function confirmarIds(ids){
  if (!ids.length) return;
  ids.forEach(function(id){ var t=transacciones.filter(function(x){return x.id===id;})[0]; if(t) t.validado=true; });
  render();
  google.script.run.withFailureHandler(function(){
    ids.forEach(function(id){ var t=transacciones.filter(function(x){return x.id===id;})[0]; if(t) t.validado=false; });
    toast('No se pudo confirmar. Probá de nuevo.'); render();
  }).marcarValidadas(ids);
}
function confirmarUno(id){ confirmarIds([id]); }
function confirmarCompletos(){
  confirmarIds(transacciones.filter(function(t){ return esPendiente(t) && !faltaCat(t) && !t._sync; }).map(function(t){ return t.id; }));
}

/* =====================  SHEET: NUEVO MOVIMIENTO  ===================== */
var nuevo = null;
function abrirNuevo(){
  var ultima = lsGet('mg-cuenta');
  var nombres = cuentas.map(nombreCuenta);
  var cta = nombres.indexOf(ultima) !== -1 ? ultima : (nombres[0] || '');
  nuevo = { tipo:'gasto', cuenta:cta, moneda:monedaDeCuenta(cta), categoria:'', subcategoria:'', fecha:isoHoy() };
  pintarNuevo(true);
}
function pintarNuevo(foco){
  var n = nuevo;
  var nombres = cuentas.map(nombreCuenta);
  var orden = [n.cuenta].concat(nombres.filter(function(x){ return x!==n.cuenta; }));
  var rec = []; try { rec = JSON.parse(lsGet('mg-cats')||'[]'); } catch(e){}
  var todas = categoriasLista();
  var chipsCat = rec.filter(function(c){ return todas.indexOf(c)!==-1; });
  if (n.tipo==='ingreso' && chipsCat.indexOf('Ingresos')===-1) chipsCat.unshift('Ingresos');
  var valMonto = (document.getElementById('n-monto')||{}).value || '';
  var valConc = (document.getElementById('n-conc')||{}).value || '';
  var h = '<div class="sheetbg" onclick="if(event.target===this)cerrarSheet()"><div class="sheet" role="dialog" aria-label="Nuevo movimiento">'
    + '<div class="hd"><h2 class="t">Nuevo movimiento</h2><button class="x" aria-label="Cerrar" onclick="cerrarSheet()">'+ic('close',22)+'</button></div>'
    + '<div class="seg"><button class="'+(n.tipo==='gasto'?'on':'')+'" onclick="nuevo.tipo=\'gasto\';pintarNuevo()">Gasto</button><button class="'+(n.tipo==='ingreso'?'on':'')+'" onclick="nuevo.tipo=\'ingreso\';pintarNuevo()">Ingreso</button></div>'
    + '<div><span class="lbl">Monto</span><div class="amt"><input id="n-monto" inputmode="decimal" placeholder="0,00" autocomplete="off" value="'+esc(valMonto)+'" aria-label="Monto"><span class="t" style="font-size:22px;color:var(--ink2)">'+esc(n.moneda)+'</span></div></div>'
    + '<div class="chips" role="group" aria-label="Moneda">'+['EUR','ARS','USD'].map(function(m){ return '<button class="cb'+(n.moneda===m?' on':'')+'" onclick="nuevo.moneda=\''+m+'\';pintarNuevo()">'+m+'</button>'; }).join('')+'</div>'
    + '<div><span class="lbl">Cuenta</span><div class="chips">'+orden.map(function(c){ return '<button class="cb'+(n.cuenta===c?' on':'')+'" data-cta="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')+'</div></div>'
    + '<div><span class="lbl">Categoría</span>'
    + (chipsCat.length ? '<div class="chips">'+chipsCat.map(function(c){ return '<button class="cb'+(n.categoria===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')+'</div>' : '')
    + '<select id="n-cat" class="fld"><option value="">'+(chipsCat.length?'Todas las categorías…':'Elegí una categoría…')+'</option>'+todas.map(function(c){ return '<option'+(n.categoria===c?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></div>'
    + (n.categoria ? '<div><span class="lbl">Subcategoría</span><select id="n-sub" class="fld"><option value="">Sin subcategoría</option>'+subcatsDe(n.categoria).map(function(s){ return '<option'+(n.subcategoria===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>' : '')
    + '<div class="two"><div><span class="lbl">Concepto</span><input id="n-conc" class="fld" placeholder="Ej: Mercadona" autocomplete="off" value="'+esc(valConc)+'"></div><div><span class="lbl">Fecha</span><input id="n-fecha" class="fld" type="date" value="'+esc(n.fecha)+'"></div></div>'
    + '<div id="n-err"></div>'
    + '<div style="display:flex;gap:10px"><button class="btn p" style="flex:1;height:52px;font-size:16px" onclick="enviarNuevo(false)">Guardar</button><button class="btn" style="height:52px" onclick="enviarNuevo(true)">Guardar y otro</button></div>'
    + '</div></div>';
  document.getElementById('overlay').innerHTML = h;
  var o = document.getElementById('overlay');
  o.querySelectorAll('[data-cat]').forEach(function(b){ b.addEventListener('click', function(){ leerNuevo(); nuevo.categoria=b.dataset.cat; nuevo.subcategoria=''; pintarNuevo(); }); });
  o.querySelectorAll('[data-cta]').forEach(function(b){ b.addEventListener('click', function(){ elegirCuenta(b.dataset.cta); }); });
  document.getElementById('n-cat').addEventListener('change', function(e){ leerNuevo(); nuevo.categoria=e.target.value; nuevo.subcategoria=''; pintarNuevo(); });
  if (foco) setTimeout(function(){ var m=document.getElementById('n-monto'); if(m) m.focus(); }, 60);
}
function leerNuevo(){
  var f = document.getElementById('n-fecha'); if (f) nuevo.fecha = f.value;
  var s = document.getElementById('n-sub'); if (s) nuevo.subcategoria = s.value;
}
function elegirCuenta(c){ leerNuevo(); nuevo.cuenta = c; nuevo.moneda = monedaDeCuenta(c); pintarNuevo(); }
function cerrarSheet(){ document.getElementById('overlay').innerHTML=''; nuevo=null; edit=null; }
function enviarNuevo(otro){
  leerNuevo();
  var raw = (document.getElementById('n-monto').value||'').trim().replace(/\s/g,'');
  if (raw.indexOf(',')!==-1) raw = raw.replace(/\./g,'').replace(',','.');
  var monto = Math.abs(Number(raw));
  var concepto = (document.getElementById('n-conc').value||'').trim();
  var err = !monto ? 'Poné el monto.' : !concepto ? 'Poné un concepto.' : !nuevo.cuenta ? 'Elegí una cuenta.' : !nuevo.fecha ? 'Elegí la fecha.' : '';
  if (err) { document.getElementById('n-err').innerHTML = '<div class="err" role="alert">'+err+'</div>'; return; }
  var f = { fecha:nuevo.fecha, concepto:concepto, monto: nuevo.tipo==='gasto' ? -monto : monto, moneda:nuevo.moneda, cuenta:nuevo.cuenta, categoria:nuevo.categoria, subcategoria:nuevo.subcategoria };
  guardarMovimiento(f);
  if (otro) { var c=nuevo.cuenta, m=nuevo.moneda, t=nuevo.tipo; nuevo={tipo:t,cuenta:c,moneda:m,categoria:'',subcategoria:'',fecha:isoHoy()}; document.getElementById('overlay').innerHTML=''; pintarNuevo(true); toast('Guardado ✓'); }
  else { cerrarSheet(); toast('Guardado ✓'); }
}

/* =====================  SHEET: EDITAR CATEGORÍA  ===================== */
var edit = null;
function abrirEditar(id){
  var t = transacciones.filter(function(x){ return x.id===id; })[0]; if (!t) return;
  if (t._sync) { toast('Espera a que termine de guardarse'); return; }
  edit = { id:id, categoria:t.categoria, subcategoria:t.subcategoria, fecha:fechaAISO(t.fecha) };
  pintarEditar();
}
function pintarEditar(){
  var t = transacciones.filter(function(x){ return x.id===edit.id; })[0];
  var todas = categoriasLista();
  var h = '<div class="sheetbg" onclick="if(event.target===this)cerrarSheet()"><div class="sheet" role="dialog" aria-label="Editar movimiento">'
    + '<div class="hd"><h2 class="t">Editar movimiento</h2><button class="x" aria-label="Cerrar" onclick="cerrarSheet()">'+ic('close',22)+'</button></div>'
    + '<div class="card"><div style="font-size:16px;font-weight:700">'+esc(t.concepto)+'</div><div class="muted" style="font-size:13px">'+esc(t.cuenta)+' · '+esc(t.fecha)+'</div><div class="t num" style="font-size:26px">'+fmt(t.monto,t.moneda,true)+'</div></div>'
    + '<div><span class="lbl">Fecha</span><input id="e-fecha" class="fld" type="date" value="'+esc(edit.fecha)+'" max="2100-12-31"></div>'
    + '<div><span class="lbl">Categoría</span><select id="e-cat" class="fld"><option value="">Elegí una categoría…</option>'+todas.map(function(c){ return '<option'+(edit.categoria===c?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></div>'
    + (edit.categoria ? '<div><span class="lbl">Subcategoría</span><select id="e-sub" class="fld"><option value="">Sin subcategoría</option>'+subcatsDe(edit.categoria).map(function(s){ return '<option'+(edit.subcategoria===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>' : '')
    + '<div id="e-err"></div>'
    + '<div style="display:flex;gap:10px"><button class="btn p" style="flex:1;height:52px;font-size:16px" onclick="guardarEdicion(false)">Guardar</button>'
    + (esPendiente(t) ? '<button class="btn" style="height:52px" onclick="guardarEdicion(true)">Guardar y confirmar</button>' : '')
    + '</div>'
    + (edit.borrar
        ? '<div class="err" role="alert" style="display:flex;flex-direction:column;gap:8px">¿Eliminar "'+esc(t.concepto)+'" ('+fmt(t.monto,t.moneda,true)+')? Se borra del Sheet y no se puede deshacer.<div style="display:flex;gap:10px"><button class="btn" style="flex:1;background:var(--amber);border-color:var(--amber);color:#fff" onclick="eliminarMovimiento()">Sí, eliminar</button><button class="btn" style="flex:1" onclick="edit.borrar=false;pintarEditar()">Cancelar</button></div></div>'
        : '<button class="linkbtn" style="color:var(--amber);justify-content:center;width:100%" onclick="edit.borrar=true;pintarEditar()">Eliminar movimiento</button>')
    + '</div></div>';
  document.getElementById('overlay').innerHTML = h;
  document.getElementById('e-fecha').addEventListener('change', function(e){ edit.fecha=e.target.value; });
  document.getElementById('e-cat').addEventListener('change', function(e){ edit.categoria=e.target.value; edit.subcategoria=''; pintarEditar(); });
  var s = document.getElementById('e-sub'); if (s) s.addEventListener('change', function(e){ edit.subcategoria=e.target.value; });
}
function eliminarMovimiento(){
  var id = edit.id;
  var i = -1; transacciones.forEach(function(x,k){ if (x.id===id) i = k; });
  if (i < 0) return;
  var t = transacciones[i];
  transacciones.splice(i, 1);
  cerrarSheet(); render(); toast('Movimiento eliminado');
  function volver(msg){ transacciones.push(t); transacciones.sort(function(a,b){ return parseF(b.fecha)-parseF(a.fecha); }); toast(msg); render(); }
  google.script.run.withFailureHandler(function(){ volver('No se pudo eliminar'); })
    .withSuccessHandler(function(r){ if (r && r.ok === false) volver(r.error || 'No se pudo eliminar'); })
    .eliminarTransaccion(id);
}
function guardarEdicion(confirmar){
  var fe = document.getElementById('e-fecha'); if (fe) edit.fecha = fe.value;
  if (confirmar && !edit.categoria) { document.getElementById('e-err').innerHTML='<div class="err" role="alert">Elegí una categoría para confirmar.</div>'; return; }
  if (!edit.fecha) { document.getElementById('e-err').innerHTML='<div class="err" role="alert">Elegí una fecha.</div>'; return; }
  var s = document.getElementById('e-sub'); if (s) edit.subcategoria = s.value;
  var id = edit.id, cat = edit.categoria, sub = edit.subcategoria, fecha = edit.fecha;
  var t = transacciones.filter(function(x){ return x.id===id; })[0];
  var antes = { c:t.categoria, s:t.subcategoria, f:t.fecha };
  t.categoria = cat; t.subcategoria = sub; t.fecha = isoAfmt(fecha);
  transacciones.sort(function(a,b){ return parseF(b.fecha)-parseF(a.fecha); });
  cerrarSheet(); render();
  google.script.run.withFailureHandler(function(){
    t.categoria = antes.c; t.subcategoria = antes.s; t.fecha = antes.f;
    transacciones.sort(function(a,b){ return parseF(b.fecha)-parseF(a.fecha); });
    toast('No se pudo guardar el cambio'); render();
  }).withSuccessHandler(function(r){
    if (r && r.ok === false) { t.categoria = antes.c; t.subcategoria = antes.s; t.fecha = antes.f; transacciones.sort(function(a,b){ return parseF(b.fecha)-parseF(a.fecha); }); toast(r.error || 'No se pudo guardar el cambio'); render(); return; }
    if (confirmar) confirmarIds([id]);
  }).actualizarMovimiento(id, { fecha: fecha, categoria: cat, subcategoria: sub });
}


/* =====================  ATAJO DEL IPHONE  ===================== */
function abrirAtajo(){
  document.getElementById('overlay').innerHTML = '<div class="sheetbg" onclick="if(event.target===this)cerrarSheet()"><div class="sheet" role="dialog" aria-label="Atajo del iPhone"><div class="hd"><h2 class="t">Atajo del iPhone</h2><button class="x" aria-label="Cerrar" onclick="cerrarSheet()">'+ic('close',22)+'</button></div><div class="muted" id="atajo-body">Buscando tu clave…</div></div></div>';
  google.script.run.withSuccessHandler(function(r){
    var el = document.getElementById('atajo-body'); if (!el) return;
    if (!r || !r.clave) { el.innerHTML = '<div class="err">No pude leer la clave.</div>'; return; }
    el.innerHTML = '<div class="card"><span class="lbl">Tu clave secreta</span><div class="num" id="atajo-clave" style="font-size:18px;font-weight:700;word-break:break-all;user-select:all">'+esc(r.clave)+'</div><button class="btn" onclick="copiarAtajo()">Copiar clave</button></div>'
      + '<div style="margin-top:12px">Esta clave es la contraseña que usa el Atajo para anotar tus pagos. No la compartas. Los pagos llegan como <b>pendientes</b> y los confirmás desde Movimientos.</div>'
      + '<div style="margin-top:8px">Cuentas que reconoce: '+esc((r.cuentas||[]).join(', '))+'</div>';
  }).withFailureHandler(function(){ var el = document.getElementById('atajo-body'); if (el) el.innerHTML = '<div class="err">No pude leer la clave.</div>'; }).getConfigAtajo();
}
function copiarAtajo(){
  var t = document.getElementById('atajo-clave').textContent;
  function ok(){ toast('Clave copiada'); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function(){ toast('Mantené apretada la clave para copiarla'); });
  else toast('Mantené apretada la clave para copiarla');
}

document.addEventListener('keydown', function(e){ if (e.key==='Escape') cerrarSheet(); });
cargar(false);
</script>
