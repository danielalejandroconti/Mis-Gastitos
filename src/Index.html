<style>

/* ---------- shell ---------- */

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}

.big{font-size:34px;line-height:1.05}
.bar{height:8px;border-radius:4px;background:#E8EBE3;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:4px}
.catrow{display:flex;flex-direction:column;gap:5px}

.row{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line-soft);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}

.row .a.pos{color:var(--green)}

.tag.sy{background:var(--blue-bg);color:var(--blue)}

/* ---------- sheets (Nuevo / Editar) ---------- */

.sheet h2{margin:0;font-size:22px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between}
.x{width:44px;height:44px;border:0;background:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;margin-right:-10px}
.amt{display:flex;align-items:center;gap:10px}
.amt input{flex:1;min-width:0;border:0;background:none;font:700 44px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;color:var(--ink);padding:0;width:100%}
.amt input:focus{outline:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cb{flex:0 0 auto;min-height:44px;border-radius:22px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font:600 14px 'Figtree',sans-serif;padding:0 16px;white-space:nowrap}
.cb.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.lbl{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;display:block}
.fld{height:48px;width:100%;border:1px solid var(--ctl);border-radius:12px;background:#fff;padding:0 14px;font:400 16px 'Figtree',sans-serif;color:var(--ink)}
select.fld{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:100;text-align:center;padding:24px;color:var(--ink2);font-weight:600}
</style>

<body>

<div id="boot"><div class="t" style="font-size:26px;color:var(--ink)">Mis gastitos</div><div id="boot-msg">Cargando tus datos…</div></div>

<div class="app" id="app" hidden>
  <nav class="side" aria-label="Principal">
    <div class="t brand">Mis gastitos</div>
    <button class="sl" data-go="inicio"><span data-ic="home"></span>Inicio</button>
    <button class="sl" data-go="mov"><span data-ic="list"></span><span>Movimientos</span><span class="b hidden" id="side-badge">0</span></button>
    <a class="sl" href="<?= ScriptApp.getService().getUrl() ?>?v=old"><span data-ic="upload"></span>Cierre de mes</a>
    <button class="sl" data-go="cuentas"><span data-ic="wallet"></span>Cuentas</button>
    <div class="side-note"><b style="color:var(--ink)">Tus datos viven en tu Google Sheet.</b> <span id="side-sync">Sincronizado.</span><br><br>Cierre de mes, acciones y reglas siguen en la versión anterior hasta que las pasemos.</div>
  </nav>

  <div class="main">
    <main class="content" id="content"></main>
  </div>

  <nav class="bottom" aria-label="Principal">
    <button class="bn" data-go="inicio"><span class="ico" data-ic="home"></span>Inicio</button>
    <button class="bn" data-go="mov"><span class="ico"><span data-ic="list"></span><span class="badge hidden" id="bn-badge">0</span></span>Movimientos</button>
    <div class="fab"><button id="fab" aria-label="Nuevo movimiento"><span data-ic="plus" data-size="24" data-sw="2.2"></span></button></div>
    <a class="bn" href="<?= ScriptApp.getService().getUrl() ?>?v=old"><span class="ico" data-ic="upload"></span>Cierre</a>
    <button class="bn" data-go="cuentas"><span class="ico" data-ic="wallet"></span>Cuentas</button>
  </nav>
</div>

<div id="overlay"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
/* =====================================================================
 * MIS GASTITOS v2 — Corte 1: Inicio · Movimientos · Nuevo movimiento
 * Backend: mismas llamadas de siempre (getBootstrap, getTransacciones, ...)
 * + addTransaccionManual (idempotente por id) y marcarValidadas.
 * ===================================================================== */
const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  wallet:'<path d="M3 7a2 2 0 012-2h13v4"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 14h2"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>'
};
function ic(name, size, sw){
  return '<svg viewBox="0 0 24 24" width="'+(size||22)+'" height="'+(size||22)+'" fill="none" stroke="currentColor" stroke-width="'+(sw||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[name]+'</svg>';
}
document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = ic(el.dataset.ic, Number(el.dataset.size)||22, el.dataset.sw); });

/* ---------- estado ---------- */
var cuentas = [], reglas = [], transacciones = [], patrimonio = { grupos: [], totalEUR: 0 };
var vista = 'inicio';
var filtroMov = 'todos';      // 'todos' | 'pendientes'
var textoBusqueda = '';
var cola = [];                // altas locales que todavía no confirmó el servidor
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MESES_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var CATS_FALLBACK = ['Vivienda','Vida Diaria','Social/Ocio','Bienestar','Compras','Tarjeta','Ingresos','Ahorro/Inversión'];
var SUBCATS_BASE = {
  'Vivienda':['Alquiler','Hipoteca','Luz','Agua','Gas','Internet','Comunidad','Seguro hogar','Mantenimiento'],
  'Vida Diaria':['Supermercado','Transporte','Farmacia','Cuidado personal','Limpieza'],
  'Social/Ocio':['Restaurantes','Bares','Salidas','Viajes','Streaming','Regalos','Diversión'],
  'Bienestar':['Gimnasio','Deporte','Cuidado personal'],
  'Compras':['Ropa','Tecnología','Hogar','Regalos','Otros'],
  'Tarjeta':['Pago tarjeta','Liquidación tarjeta'],
  'Ingresos':['Sueldo','Freelance','Reintegro','Otros ingresos'],
  'Ahorro/Inversión':['Ahorro','Acciones','Crypto','Fondo emergencia','Transferencia propia']
};

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
}
function parseF(f){ var p=String(f).split('/'); return new Date(Number(p[2]),Number(p[1])-1,Number(p[0])); }
function isoHoy(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoAfmt(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmt(n, moneda, signo){
  var abs = Math.abs(n), neg = n < 0;
  var dec = (moneda==='ARS') ? 0 : (abs >= 1000 ? 0 : 2);
  var parts = abs.toFixed(dec).split('.');
  var s = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.') + (parts[1] ? ','+parts[1] : '');
  var pre = moneda==='ARS' ? '$ ' : moneda==='USD' ? 'US$ ' : '';
  var suf = moneda==='EUR' || !moneda ? ' €' : '';
  var sg = neg ? '−' : (signo ? '+' : '');
  return sg + pre + s + suf;
}
function esPendiente(t){ return t.validado === false; }
function faltaCat(t){ return !t.categoria; }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function toast(msg){
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.remove('hidden');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.add('hidden'); },2600);
}
function categoriasLista(){
  var s = {}; CATS_FALLBACK.forEach(function(c){ s[c]=1; });
  reglas.forEach(function(r){ if(r.categoria) s[r.categoria]=1; });
  transacciones.forEach(function(t){ if(t.categoria) s[t.categoria]=1; });
  return Object.keys(s).sort(function(a,b){ return a.localeCompare(b,'es'); });
}
function subcatsDe(cat){
  var s = {}; (SUBCATS_BASE[cat]||[]).forEach(function(x){ s[x]=1; });
  reglas.forEach(function(r){ if(r.categoria===cat && r.subcategoria) s[r.subcategoria]=1; });
  transacciones.forEach(function(t){ if(t.categoria===cat && t.subcategoria) s[t.subcategoria]=1; });
  return Object.keys(s).sort(function(a,b){ return a.localeCompare(b,'es'); });
}
function nombreCuenta(c){ return c['Nombre']; }
function monedaDeCuenta(nombre){ var c = cuentas.filter(function(x){return x['Nombre']===nombre;})[0]; return c ? c['Moneda'] : 'EUR'; }

/* ---------- carga ---------- */
function bootMsg(m){ document.getElementById('boot-msg').textContent = m; }
function bootError(err){
  var el = document.getElementById('boot');
  el.innerHTML = '<div class="t" style="font-size:22px;color:var(--ink)">No se pudo conectar con tu Sheet</div><div style="max-width:420px">'+esc(err && err.message ? err.message : String(err))+'</div><button class="btn p" onclick="location.reload()">Reintentar</button>';
}
var cargando = false;
function aplicarDatos(boot, txs){
  cuentas = boot.cuentas || []; reglas = boot.reglas || []; patrimonio = boot.patrimonio || patrimonio;
  if (boot.metaAhorro != null) metaAhorro = Number(boot.metaAhorro) || 0;
  var enCola = {}; cola.forEach(function(q){ enCola[q.tx.id]=true; });
  var servidor = txs.filter(function(t){ return !enCola[t.id]; });
  transacciones = cola.map(function(q){ return q.tx; }).concat(servidor);
  transacciones.sort(function(a,b){ return parseF(b.fecha)-parseF(a.fecha); });
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('app').hidden = false;
}
function cargar(silencioso){
  var hayCache = false;
  if (!silencioso) {
    var cache = null; try { cache = JSON.parse(lsGet('mg-cache') || 'null'); } catch(e){}
    if (cache && cache.boot && cache.tx) { aplicarDatos(cache.boot, cache.tx); hayCache = true; }
    else bootMsg('Cargando tus datos…');
  }
  cargando = true; setSync('ok'); if (hayCache) render();
  var res = {}, fallo = false;
  function error(e){
    if (fallo) return; fallo = true; cargando = false;
    if (!silencioso && !hayCache) bootError(e); else { setSync('err'); render(); }
  }
  function listo(){
    if (!res.boot || !res.tx) return;
    cargando = false;
    aplicarDatos(res.boot, res.tx);
    lsSet('mg-cache', JSON.stringify({ boot:{ cuentas:res.boot.cuentas, reglas:res.boot.reglas, patrimonio:res.boot.patrimonio, metaAhorro:res.boot.metaAhorro }, tx:res.tx }));
    setSync('ok'); render();
  }
  // las dos llamadas salen a la vez (antes iban una después de la otra)
  google.script.run.withFailureHandler(error).withSuccessHandler(function(d){
    if (!d) { error({message:'El servidor devolvió una respuesta vacía. Recargá la página.'}); return; }
    res.boot = d; listo();
  }).getBootstrapLiviano();
  google.script.run.withFailureHandler(error).withSuccessHandler(function(t){
    if (!t) { error({message:'No llegaron los movimientos (respuesta vacía). Recargá la página.'}); return; }
    res.tx = t; listo();
  }).getTransacciones();
}

/* ---------- sincronización de altas (optimista) ---------- */
function setSync(estado){
  var enviando = cola.filter(function(q){ return !q.error; }).length;
  var fallidas = cola.filter(function(q){ return q.error; }).length;
  var side = document.getElementById('side-sync');
  if (side) side.textContent = fallidas ? (fallidas+' sin guardar.') : enviando ? 'Sincronizando…' : (estado==='err' ? 'Sin conexión con el Sheet.' : 'Sincronizado.');
  var slot = document.getElementById('sync-slot');
  if (slot) slot.innerHTML = syncHtml(estado);
}
function syncHtml(estado){
  var enviando = cola.filter(function(q){ return !q.error; }).length;
  var fallidas = cola.filter(function(q){ return q.error; }).length;
  if (cargando && !fallidas) return '<div class="sync">Actualizando…</div>';
  if (fallidas) return '<div class="sync err">'+fallidas+' sin guardar <button onclick="reintentarCola()">Reintentar</button></div>';
  if (enviando) return '<div class="sync">Sincronizando…</div>';
  if (estado==='err') return '<div class="sync err">Sin conexión <button onclick="cargar(true)">Reintentar</button></div>';
  return '';
}
function enviar(q){
  q.error = false;
  google.script.run
    .withSuccessHandler(function(r){
      cola = cola.filter(function(x){ return x !== q; });
      delete q.tx._sync;
      if (r && r.ok === false) { toast(r.error || 'No se pudo guardar'); }
      setSync('ok'); render();
    })

}

function guardarMovimiento(f){
  var id = uuid();
  var payload = { id:id, fecha:f.fecha, concepto:f.concepto, monto:f.monto, moneda:f.moneda, cuenta:f.cuenta, categoria:f.categoria, subcategoria:f.subcategoria, origen:'manual' };

  transacciones.unshift(tx);
  transacciones.sort(function(a,b){ return parseF(b.fecha)-parseF(a.fecha); });

var C_ING = '#0E6B4D', C_GAS = '#A8480A';

// Lo que realmente gastó/ganó Dani: si hay "Mi parte", el gasto cuenta solo su parte.
function efectivo(t){ return (t.miParte != null && t.monto < 0) ? -Math.abs(t.miParte) : t.monto; }

// Misma lógica que la versión anterior: solo EUR, sin Ahorro/Inversión, ingresos = categoría "Ingresos",
// gasto de cada categoría = neto del mes (los reembolsos de esa categoría restan).
function calcAnio(anio){
  var meses = []; for (var i=0;i<12;i++) meses.push({ ing:0, gas:0, neto:{}, porCat:{} });
  transacciones.forEach(function(t){
    if (t.moneda !== 'EUR' || t.categoria === 'Ahorro/Inversión') return;
    var f = parseF(t.fecha); if (isNaN(f.getTime()) || f.getFullYear() !== anio) return;
    var m = f.getMonth(), v = efectivo(t);
    if (t.categoria === 'Ingresos') meses[m].ing += v;
    else { var c = t.categoria || 'Sin categoría'; meses[m].neto[c] = (meses[m].neto[c]||0) + v; }
  });
  meses.forEach(function(x){
    Object.keys(x.neto).forEach(function(c){ if (x.neto[c] < 0) { x.porCat[c] = -x.neto[c]; x.gas += -x.neto[c]; } });
  });
  return meses;
}
function arsDelMes(a, m){
  var tot = 0;
  transacciones.forEach(function(t){
    if (t.moneda !== 'ARS' || t.monto >= 0 || t.categoria === 'Ahorro/Inversión') return;
    var d = parseF(t.fecha); if (d.getFullYear()===a && d.getMonth()===m) tot += -efectivo(t);
  });
  return tot;
}
function hoyAM(){ var h = new Date(); return { a:h.getFullYear(), m:h.getMonth() }; }
function cambiarMes(d){
  var h = hoyAM(), n = mesVer.m + d, a = mesVer.a;
  if (n < 0) { n = 11; a--; } if (n > 11) { n = 0; a++; }
  if (a > h.a || (a === h.a && n > h.m)) return;
  mesVer = { a:a, m:n }; render();
}
function cambiarAnio(d){ var n = anioVer + d; if (n > hoyAM().a) return; anioVer = n; selMes = null; render(); }
function setTabInicio(t){ tabInicio = t; render(); }
function verMes(a, m){ mesVer = { a:a, m:m }; tabInicio = 'mes'; render(); window.scrollTo(0,0); }
function fmtK(n){ var a = Math.abs(n); return a >= 1000 ? (Math.round(a/100)/10).toString().replace('.',',')+'k' : String(Math.round(a)); }

}
function htmlInicio(){

function htmlMes(){

                : '<div class="muted" style="font-size:14px">No hay nada esperando confirmación.</div>')

  grupos.forEach(function(x){
    var mon = x.moneda || x.grupo;
    h += '<div class="pat"><span><i class="dot" style="background:'+(col[x.grupo]||'#566159')+'"></i>'+esc(x.grupo)+'</span><span class="num" style="font-weight:700">'+fmt(x.total, mon==='USD'?'USD':mon==='ARS'?'ARS':'EUR')+'</span></div>';
  });
  if (patrimonio.totalEUR) h += '<div class="card dashed" style="padding:10px 12px;flex-direction:row;justify-content:space-between;border-radius:12px"><span class="muted" style="font-size:13px">Total referencial</span><span class="num" style="font-weight:700">≈ '+fmt(patrimonio.totalEUR,'EUR')+'</span></div>';
  h += '</div></div>';
  return h;

/* ---------- Año ---------- */
function barPath(x, y, w, hh, r){
  if (hh <= 0) return '';
  r = Math.min(r, hh, w/2);
  return 'M'+x+' '+(y+hh)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+hh)+'Z';
}
function niceMax(v){ if (v <= 0) return 100; var e = Math.pow(10, Math.floor(Math.log10(v))); var f = v/e; var n = f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*e; }

function svgColumnas(meses, hasta){
  var W=340, Ht=170, L=30, B=20, T=8, R=4, pw = W-L-R, ph = Ht-B-T;
  var max = niceMax(Math.max.apply(null, meses.map(function(x){ return Math.max(x.ing, x.gas); }).concat([1])));
  var slot = pw/12, bw = 9;
  var s = '<svg viewBox="0 0 '+W+' '+Ht+'" width="100%" role="img" aria-label="Ingresos y gastos por mes" style="display:block">';
  [0,0.5,1].forEach(function(f){
    var y = T + ph - f*ph;
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#E3E6DE" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9.5" fill="#566159">'+fmtK(max*f)+'</text>';
  });
  meses.forEach(function(x, i){
    var cx = L + slot*i + slot/2, on = (selMes === i);
    if (on) s += '<rect x="'+(L+slot*i+1)+'" y="'+T+'" width="'+(slot-2)+'" height="'+ph+'" rx="6" fill="#F3F4EF"/>';
    if (i <= hasta) {
      var hi = x.ing/max*ph, hg = x.gas/max*ph;
      s += '<path d="'+barPath(cx-bw-1, T+ph-hi, bw, hi, 4)+'" fill="'+C_ING+'"/>';
      s += '<path d="'+barPath(cx+1, T+ph-hg, bw, hg, 4)+'" fill="'+C_GAS+'"/>';
    }
    s += '<text x="'+cx+'" y="'+(Ht-5)+'" text-anchor="middle" font-size="10" fill="'+(on?'#17211C':'#566159')+'" font-weight="'+(on?'700':'500')+'">'+MESES[i].charAt(0).toUpperCase()+'</text>';
    s += '<rect data-m="'+i+'" x="'+(L+slot*i)+'" y="0" width="'+slot+'" height="'+Ht+'" fill="transparent" style="cursor:pointer"/>';
  });
  return s + '</svg>';
}
function svgAcumulado(meses, hasta){
  var W=340, Ht=110, L=30, R=34, T=10, B=18, pw=W-L-R, ph=Ht-T-B;
  var vals = [], acc = 0;
  for (var i=0;i<=hasta;i++){ acc += meses[i].ing - meses[i].gas; vals.push(acc); }
  if (!vals.length) return '';
  var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(1, Math.max.apply(null, vals)), rg = (hi-lo)||1;
  var step = pw/11;
  function X(i){ return L + step*i; } function Y(v){ return T + ph - (v-lo)/rg*ph; }
  var s = '<svg viewBox="0 0 '+W+' '+Ht+'" width="100%" role="img" aria-label="Ahorro acumulado del año" style="display:block">';
  s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#C9CEC4" stroke-width="1"/><text x="'+(L-5)+'" y="'+(Y(0)+3.5)+'" text-anchor="end" font-size="9.5" fill="#566159">0</text>';
  s += '<polyline fill="none" stroke="'+C_ING+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="'+vals.map(function(v,i){ return X(i)+','+Y(v); }).join(' ')+'"/>';
  var li = vals.length-1;
  s += '<circle cx="'+X(li)+'" cy="'+Y(vals[li])+'" r="4.5" fill="'+C_ING+'" stroke="#fff" stroke-width="2"/>';
  s += '<text x="'+Math.min(X(li)+8, W-2)+'" y="'+(Y(vals[li])+3.5)+'" font-size="11" font-weight="700" fill="#17211C" text-anchor="'+(X(li)+8>W-40?'end':'start')+'">'+(X(li)+8>W-40?'':'')+fmtK(vals[li])+'</text>';
  for (var k=0;k<12;k++) s += '<text x="'+X(k)+'" y="'+(Ht-4)+'" text-anchor="middle" font-size="10" fill="#566159">'+MESES[k].charAt(0).toUpperCase()+'</text>';
  return s + '</svg>';
}
function htmlAnio(){
  var H = hoyAM(), A = anioVer, meses = calcAnio(A);

  var ing = 0, gas = 0, cat = {};

  var ahorro = ing - gas, tasa = ing > 0 ? Math.round(ahorro/ing*100) : null;
  var pct = metaAhorro > 0 ? Math.min(100, Math.max(0, ahorro/metaAhorro*100)) : 0;
  var restan = (A === H.a) ? 11 - H.m : 0, falta = metaAhorro - ahorro;

     + '<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:14px"><span><span class="muted">Ingresos</span> <b class="num">'+fmt(ing,'EUR')+'</b></span><span><span class="muted">Gastos</span> <b class="num">'+fmt(gas,'EUR')+'</b></span>'+(tasa!==null?'<span><span class="muted">Tasa de ahorro</span> <b class="num">'+tasa+'%</b></span>':'')+'</span></div>'
     + '<div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><i style="width:'+pct.toFixed(0)+'%"></i></div>'
     + '<div class="muted" style="font-size:13px;margin-top:6px">'+Math.round(pct)+'% de tu meta'
     + (falta > 0 && restan > 0 ? ' · te faltan '+fmt(falta,'EUR')+' (~'+fmt(falta/restan,'EUR')+'/mes en los '+restan+' meses que quedan)' : falta <= 0 ? ' · ¡meta cumplida!' : '')+'</div></div>'
     + '<div style="display:flex;align-items:center;gap:10px"><label class="lbl" for="meta" style="margin:0">Meta anual (€)</label><input id="meta" class="fld" style="width:130px;height:40px" inputmode="numeric" value="'+metaAhorro+'"></div></div>';

  h += '<div class="card"><h2 class="t">Ingresos y gastos por mes</h2>'
     + '<div style="display:flex;gap:14px;font-size:13px;font-weight:600"><span><i class="dot" style="background:'+C_ING+'"></i>Ingresos</span><span><i class="dot" style="background:'+C_GAS+'"></i>Gastos</span></div>'
     + '<div id="chart1" style="max-width:600px;width:100%">'+svgColumnas(meses, hasta)+'</div><div id="readout" style="font-size:14px;min-height:42px"></div></div>';

  h += '<div class="card"><h2 class="t">Ahorro acumulado</h2><div class="muted" style="font-size:13px;margin-top:-6px">Ingresos menos gastos, mes a mes (en k €)</div><div style="max-width:600px;width:100%">'+svgAcumulado(meses, hasta)+'</div></div>';

  var cats = Object.keys(cat).sort(function(a,b){ return cat[b]-cat[a]; });
  if (cats.length) {
    var mx = cat[cats[0]];
    h += '<div class="card"><h2 class="t">Adónde se fue la plata</h2><div style="display:flex;flex-direction:column;gap:12px">';
    cats.slice(0,8).forEach(function(k){
      h += '<div class="catrow"><div class="h"><span>'+esc(k)+'</span><span class="num">'+fmt(cat[k],'EUR')+' <span class="muted" style="font-weight:500">· '+(gas?Math.round(cat[k]/gas*100):0)+'%</span></span></div><div class="bar"><i style="width:'+Math.max(3,Math.round(cat[k]/mx*100))+'%"></i></div></div>';
    });
    h += '</div></div>';
  }

  h += '<details class="card"><summary style="font-weight:700;font-size:15px;cursor:pointer;min-height:32px">Ver tabla mes a mes</summary><table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:8px"><thead><tr style="text-align:right;color:var(--ink2);font-size:12px"><th style="text-align:left;padding:6px 0">Mes</th><th>Ingresos</th><th>Gastos</th><th>Ahorro</th></tr></thead><tbody>';
  for (var m=0;m<=hasta;m++) h += '<tr style="border-top:1px solid var(--line-soft)"><td style="padding:0"><button class="linkbtn" style="color:var(--ink);font-weight:600" onclick="verMes('+A+','+m+')">'+MESES_LARGO[m]+'</button></td><td class="num" style="text-align:right">'+fmt(meses[m].ing,'EUR')+'</td><td class="num" style="text-align:right">'+fmt(meses[m].gas,'EUR')+'</td><td class="num" style="text-align:right;font-weight:700">'+fmt(meses[m].ing-meses[m].gas,'EUR')+'</td></tr>';
  h += '</tbody></table></details>';
  setTimeout(function(){ enlazarAnio(meses, hasta); }, 0);
  return h;
}

  var inv = (patrimonio.grupos||[]).filter(function(x){ return x.grupo==='Acciones' || x.grupo==='Crypto'; });
  if (inv.length) {
    h += '<div class="card"><div class="eyebrow">Inversiones</div>';
    inv.forEach(function(x){ h += '<div class="pat"><span>'+esc(x.grupo)+'</span><span class="num" style="font-weight:700">'+fmt(x.total,'EUR')+'</span></div>'; });
    h += '</div>';
  }
  if (patrimonio.totalEUR) h += '<div class="card dashed" style="flex-direction:row;justify-content:space-between;border-radius:14px"><span class="muted" style="font-size:13px">Total referencial (aprox.)</span><span class="num" style="font-weight:700">≈ '+fmt(patrimonio.totalEUR,'EUR')+'</span></div>';
  return h;
}

/* =====================  MOVIMIENTOS  ===================== */
function htmlMovimientos(){
  var pend = transacciones.filter(esPendiente).length;
  var h = '<div class="top"><h1 class="t">Movimientos</h1><div id="sync-slot"></div></div>';
  h += '<div class="seg" role="tablist"><button class="'+(filtroMov==='todos'?'on':'')+'" onclick="filtroMov=\'todos\';render()">Todos</button><button class="'+(filtroMov==='pendientes'?'on':'')+'" onclick="filtroMov=\'pendientes\';render()">Pendientes'+(pend?' · '+pend:'')+'</button></div>';
  h += '<input id="q" class="search" type="search" placeholder="Buscar concepto o monto" value="'+esc(textoBusqueda)+'" aria-label="Buscar">';
  if (filtroMov==='pendientes') {
    var completos = transacciones.filter(function(t){ return esPendiente(t) && !faltaCat(t) && !t._sync; }).length;
    if (completos) h += '<button class="btn p w" onclick="confirmarCompletos()">Confirmar los '+completos+' que están completos</button>';
  }
  h += '<div id="lista"></div>';
  setTimeout(renderLista,0);
  return h;
}
function coincide(t, q){
  if (!q) return true;
  q = q.toLowerCase().trim();
  if (String(t.concepto).toLowerCase().indexOf(q) !== -1) return true;
  var d = q.replace(/[^0-9]/g,''); if (!d) return false;
  var a = String(Math.round(Math.abs(t.monto))), b = Math.abs(t.monto).toFixed(2).replace('.','');
  return a.indexOf(d)!==-1 || b.indexOf(d)!==-1;
}
function etiquetaDia(f){
  var d = parseF(f), hoy = new Date(); hoy.setHours(0,0,0,0);
  var diff = Math.round((hoy - d)/86400000);
  if (diff===0) return 'Hoy'; if (diff===1) return 'Ayer';
  return d.getDate()+' '+MESES[d.getMonth()]+(d.getFullYear()!==hoy.getFullYear()?' '+d.getFullYear():'');
}
function renderLista(){
  var el = document.getElementById('lista'); if (!el) return;
  var xs = transacciones.filter(function(t){ return (filtroMov==='todos' || esPendiente(t)) && coincide(t, textoBusqueda); });
  var total = xs.length; xs = xs.slice(0, 150);
  if (!xs.length) { el.innerHTML = '<div class="list"><div class="empty">'+(filtroMov==='pendientes'?'No hay pendientes. ✓':'No hay movimientos que coincidan.')+'</div></div>'; return; }
  var h = '', dia = null, abierto = false;
  xs.forEach(function(t){
    var et = etiquetaDia(t.fecha);
    if (et !== dia) { if (abierto) h += '</div>'; h += '<div class="daylabel">'+esc(et)+'</div><div class="list">'; dia = et; abierto = true; }
    h += filaHtml(t);
  });
  if (abierto) h += '</div>';
  if (total > xs.length) h += '<div class="empty">Mostrando '+xs.length+' de '+total+'. Usá la búsqueda para acotar.</div>';
  el.innerHTML = h;
}
function filaHtml(t){
  var pend = esPendiente(t), falta = faltaCat(t);
  var sub = '<span>'+esc(t.cuenta)+'</span>';
  if (falta) sub += '<span class="tag a">Falta la categoría</span>';
  else sub += '<span>· '+esc(t.categoria)+(t.subcategoria?' › '+esc(t.subcategoria):'')+'</span>';
  if (t._sync === 'enviando') sub += '<span class="tag sy">Guardando…</span>';
  if (t._sync === 'error') sub += '<span class="tag a">Sin guardar</span>';
  var btn = '';
  if (pend && !t._sync) btn = '<span class="ok" role="button" tabindex="0" aria-label="Confirmar movimiento" '+(falta?'style="opacity:.35" ':'')+'onclick="event.stopPropagation();'+(falta?'abrirEditar(\''+t.id+'\')':'confirmarUno(\''+t.id+'\')')+'">'+ic('check',20,2.2)+'</span>';
  else if (!pend) btn = '<span class="ok done" aria-label="Confirmado">'+ic('check',20,2.2)+'</span>';
  else btn = '<span style="width:44px"></span>';
  return '<button class="row'+(falta&&pend?' warn':'')+'" onclick="abrirEditar(\''+t.id+'\')">'
    + '<div class="m"><div class="c">'+esc(t.concepto)+'</div><div class="s">'+sub+'</div></div>'
    + '<div class="a num'+(t.monto>0?' pos':'')+'">'+fmt(t.monto,t.moneda,true)+'</div>'+btn+'</button>';
}
function confirmarIds(ids){
  if (!ids.length) return;
  ids.forEach(function(id){ var t=transacciones.filter(function(x){return x.id===id;})[0]; if(t) t.validado=true; });
  render();
  google.script.run.withFailureHandler(function(){
    ids.forEach(function(id){ var t=transacciones.filter(function(x){return x.id===id;})[0]; if(t) t.validado=false; });
    toast('No se pudo confirmar. Probá de nuevo.'); render();
  }).marcarValidadas(ids);
}
function confirmarUno(id){ confirmarIds([id]); }
function confirmarCompletos(){
  confirmarIds(transacciones.filter(function(t){ return esPendiente(t) && !faltaCat(t) && !t._sync; }).map(function(t){ return t.id; }));
}

/* =====================  SHEET: NUEVO MOVIMIENTO  ===================== */
var nuevo = null;
function abrirNuevo(){
  var ultima = lsGet('mg-cuenta');
  var nombres = cuentas.map(nombreCuenta);
  var cta = nombres.indexOf(ultima) !== -1 ? ultima : (nombres[0] || '');
  nuevo = { tipo:'gasto', cuenta:cta, moneda:monedaDeCuenta(cta), categoria:'', subcategoria:'', fecha:isoHoy() };
  pintarNuevo(true);
}
function pintarNuevo(foco){
  var n = nuevo;
  var nombres = cuentas.map(nombreCuenta);
  var orden = [n.cuenta].concat(nombres.filter(function(x){ return x!==n.cuenta; }));
  var rec = []; try { rec = JSON.parse(lsGet('mg-cats')||'[]'); } catch(e){}
  var todas = categoriasLista();
  var chipsCat = rec.filter(function(c){ return todas.indexOf(c)!==-1; });
  if (n.tipo==='ingreso' && chipsCat.indexOf('Ingresos')===-1) chipsCat.unshift('Ingresos');
  var valMonto = (document.getElementById('n-monto')||{}).value || '';
  var valConc = (document.getElementById('n-conc')||{}).value || '';
  var h = '<div class="sheetbg" onclick="if(event.target===this)cerrarSheet()"><div class="sheet" role="dialog" aria-label="Nuevo movimiento">'
    + '<div class="hd"><h2 class="t">Nuevo movimiento</h2><button class="x" aria-label="Cerrar" onclick="cerrarSheet()">'+ic('close',22)+'</button></div>'
    + '<div class="seg"><button class="'+(n.tipo==='gasto'?'on':'')+'" onclick="nuevo.tipo=\'gasto\';pintarNuevo()">Gasto</button><button class="'+(n.tipo==='ingreso'?'on':'')+'" onclick="nuevo.tipo=\'ingreso\';pintarNuevo()">Ingreso</button></div>'
    + '<div><span class="lbl">Monto</span><div class="amt"><input id="n-monto" inputmode="decimal" placeholder="0,00" autocomplete="off" value="'+esc(valMonto)+'" aria-label="Monto"><span class="t" style="font-size:22px;color:var(--ink2)">'+esc(n.moneda)+'</span></div></div>'
    + '<div class="chips" role="group" aria-label="Moneda">'+['EUR','ARS','USD'].map(function(m){ return '<button class="cb'+(n.moneda===m?' on':'')+'" onclick="nuevo.moneda=\''+m+'\';pintarNuevo()">'+m+'</button>'; }).join('')+'</div>'
    + '<div><span class="lbl">Cuenta</span><div class="chips">'+orden.map(function(c){ return '<button class="cb'+(n.cuenta===c?' on':'')+'" data-cta="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')+'</div></div>'
    + '<div><span class="lbl">Categoría</span>'
    + (chipsCat.length ? '<div class="chips">'+chipsCat.map(function(c){ return '<button class="cb'+(n.categoria===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')+'</div>' : '')
    + '<select id="n-cat" class="fld"><option value="">'+(chipsCat.length?'Todas las categorías…':'Elegí una categoría…')+'</option>'+todas.map(function(c){ return '<option'+(n.categoria===c?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></div>'
    + (n.categoria ? '<div><span class="lbl">Subcategoría</span><select id="n-sub" class="fld"><option value="">Sin subcategoría</option>'+subcatsDe(n.categoria).map(function(s){ return '<option'+(n.subcategoria===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>' : '')
    + '<div class="two"><div><span class="lbl">Concepto</span><input id="n-conc" class="fld" placeholder="Ej: Mercadona" autocomplete="off" value="'+esc(valConc)+'"></div><div><span class="lbl">Fecha</span><input id="n-fecha" class="fld" type="date" value="'+esc(n.fecha)+'"></div></div>'
    + '<div id="n-err"></div>'
    + '<div style="display:flex;gap:10px"><button class="btn p" style="flex:1;height:52px;font-size:16px" onclick="enviarNuevo(false)">Guardar</button><button class="btn" style="height:52px" onclick="enviarNuevo(true)">Guardar y otro</button></div>'
    + '</div></div>';
  document.getElementById('overlay').innerHTML = h;
  var o = document.getElementById('overlay');
  o.querySelectorAll('[data-cat]').forEach(function(b){ b.addEventListener('click', function(){ leerNuevo(); nuevo.categoria=b.dataset.cat; nuevo.subcategoria=''; pintarNuevo(); }); });
  o.querySelectorAll('[data-cta]').forEach(function(b){ b.addEventListener('click', function(){ elegirCuenta(b.dataset.cta); }); });
  document.getElementById('n-cat').addEventListener('change', function(e){ leerNuevo(); nuevo.categoria=e.target.value; nuevo.subcategoria=''; pintarNuevo(); });
  if (foco) setTimeout(function(){ var m=document.getElementById('n-monto'); if(m) m.focus(); }, 60);
}
function leerNuevo(){
  var f = document.getElementById('n-fecha'); if (f) nuevo.fecha = f.value;
  var s = document.getElementById('n-sub'); if (s) nuevo.subcategoria = s.value;
}
function elegirCuenta(c){ leerNuevo(); nuevo.cuenta = c; nuevo.moneda = monedaDeCuenta(c); pintarNuevo(); }
function cerrarSheet(){ document.getElementById('overlay').innerHTML=''; nuevo=null; edit=null; }
function enviarNuevo(otro){
  leerNuevo();
  var raw = (document.getElementById('n-monto').value||'').trim().replace(/\s/g,'');
  if (raw.indexOf(',')!==-1) raw = raw.replace(/\./g,'').replace(',','.');
  var monto = Math.abs(Number(raw));
  var concepto = (document.getElementById('n-conc').value||'').trim();
  var err = !monto ? 'Poné el monto.' : !concepto ? 'Poné un concepto.' : !nuevo.cuenta ? 'Elegí una cuenta.' : !nuevo.fecha ? 'Elegí la fecha.' : '';
  if (err) { document.getElementById('n-err').innerHTML = '<div class="err" role="alert">'+err+'</div>'; return; }
  var f = { fecha:nuevo.fecha, concepto:concepto, monto: nuevo.tipo==='gasto' ? -monto : monto, moneda:nuevo.moneda, cuenta:nuevo.cuenta, categoria:nuevo.categoria, subcategoria:nuevo.subcategoria };
  guardarMovimiento(f);
  if (otro) { var c=nuevo.cuenta, m=nuevo.moneda, t=nuevo.tipo; nuevo={tipo:t,cuenta:c,moneda:m,categoria:'',subcategoria:'',fecha:isoHoy()}; document.getElementById('overlay').innerHTML=''; pintarNuevo(true); toast('Guardado ✓'); }
  else { cerrarSheet(); toast('Guardado ✓'); }
}

/* =====================  SHEET: EDITAR CATEGORÍA  ===================== */
var edit = null;
function abrirEditar(id){
  var t = transacciones.filter(function(x){ return x.id===id; })[0]; if (!t) return;
  if (t._sync) { toast('Espera a que termine de guardarse'); return; }
  edit = { id:id, categoria:t.categoria, subcategoria:t.subcategoria };
  pintarEditar();
}
function pintarEditar(){
  var t = transacciones.filter(function(x){ return x.id===edit.id; })[0];
  var todas = categoriasLista();
  var h = '<div class="sheetbg" onclick="if(event.target===this)cerrarSheet()"><div class="sheet" role="dialog" aria-label="Editar movimiento">'
    + '<div class="hd"><h2 class="t">Categoría</h2><button class="x" aria-label="Cerrar" onclick="cerrarSheet()">'+ic('close',22)+'</button></div>'
    + '<div class="card"><div style="font-size:16px;font-weight:700">'+esc(t.concepto)+'</div><div class="muted" style="font-size:13px">'+esc(t.cuenta)+' · '+esc(t.fecha)+'</div><div class="t num" style="font-size:26px">'+fmt(t.monto,t.moneda,true)+'</div></div>'
    + '<div><span class="lbl">Categoría</span><select id="e-cat" class="fld"><option value="">Elegí una categoría…</option>'+todas.map(function(c){ return '<option'+(edit.categoria===c?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></div>'
    + (edit.categoria ? '<div><span class="lbl">Subcategoría</span><select id="e-sub" class="fld"><option value="">Sin subcategoría</option>'+subcatsDe(edit.categoria).map(function(s){ return '<option'+(edit.subcategoria===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>' : '')
    + '<div id="e-err"></div>'
    + '<div style="display:flex;gap:10px"><button class="btn p" style="flex:1;height:52px;font-size:16px" onclick="guardarEdicion(false)">Guardar</button>'
    + (esPendiente(t) ? '<button class="btn" style="height:52px" onclick="guardarEdicion(true)">Guardar y confirmar</button>' : '')
    + '</div></div></div>';
  document.getElementById('overlay').innerHTML = h;
  document.getElementById('e-cat').addEventListener('change', function(e){ edit.categoria=e.target.value; edit.subcategoria=''; pintarEditar(); });
  var s = document.getElementById('e-sub'); if (s) s.addEventListener('change', function(e){ edit.subcategoria=e.target.value; });
}
function guardarEdicion(confirmar){
  if (!edit.categoria) { document.getElementById('e-err').innerHTML='<div class="err" role="alert">Elegí una categoría.</div>'; return; }
  var s = document.getElementById('e-sub'); if (s) edit.subcategoria = s.value;
  var id = edit.id, cat = edit.categoria, sub = edit.subcategoria;
  var t = transacciones.filter(function(x){ return x.id===id; })[0];
  var antes = { c:t.categoria, s:t.subcategoria };
  t.categoria = cat; t.subcategoria = sub;
  cerrarSheet(); render();
  google.script.run.withFailureHandler(function(){
    t.categoria = antes.c; t.subcategoria = antes.s; toast('No se pudo guardar la categoría'); render();
  }).withSuccessHandler(function(){ if (confirmar) confirmarIds([id]); }).actualizarCategoria(id, cat, sub);
}

document.addEventListener('keydown', function(e){ if (e.key==='Escape') cerrarSheet(); });
cargar(false);
</script>
